<!doctype html>
<html lang="zh-CN">
<head>

<title>月刊产线（独立版）</title>
<style>
/* 独立版补的:月刊页面要的样式变量与基础样式。原平台的全站样式是同事写的,不在本仓;
   这里按页面里用到的类名和变量名(--orange-2、--line、--white、--ink、--ink-3 等)重新写了一份最小的。 */
:root {
  --orange: #f97316;
  --orange-2: #ea580c;
  --orange-soft: #fff7ed;
  --orange-soft-2: #ffedd5;
  --orange-line: #fdba74;
  --teal: #0f766e;
  --teal-soft: #f0fdfa;
  --teal-line: #99f6e4;
  --red: #dc2626;
  --red-soft: #fef2f2;
  --red-line: #fecaca;
  --blue: #2563eb;
  --ink: #111827;
  --ink-2: #374151;
  --ink-3: #6b7280;
  --ink-4: #9ca3af;
  --line: #e5e7eb;
  --line-2: #f3f4f6;
  --bg: #f6f7f9;
  --white: #ffffff;
  --mono: ui-monospace, 'SF Mono', Menlo, Consolas, monospace;
}

* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.6 -apple-system, BlinkMacSystemFont, 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;
  -webkit-font-smoothing: antialiased;
}
.boot-status { margin: 64px auto; text-align: center; color: var(--ink-3); }
p { margin: 0; }
h2, h3 { margin: 0; }

/* ── 演示页顶栏 ── */
.demo-bar { position: sticky; top: 0; z-index: 50; background: rgba(255, 255, 255, .96); border-bottom: 1px solid var(--line); backdrop-filter: blur(6px); }
.demo-bar-inner { max-width: 1040px; margin: 0 auto; padding: 10px 20px 6px; display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; }
.demo-brand { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.demo-brand b { font-weight: 700; }
.demo-badge { font-size: 11px; font-weight: 700; color: #9a3412; background: var(--orange-soft); border: 1px solid var(--orange-line); border-radius: 999px; padding: 1px 8px; }
.demo-sub { color: var(--ink-3); font-size: 13px; }
.demo-nav { display: flex; flex-wrap: wrap; gap: 6px; margin-left: auto; }
.demo-nav a { font-size: 13px; color: var(--ink-2); text-decoration: none; padding: 4px 12px; border: 1px solid var(--line); border-radius: 999px; background: var(--white); }
.demo-nav a:hover { border-color: var(--orange-line); color: var(--orange-2); }
.demo-nav a.on { background: var(--orange); border-color: var(--orange); color: #fff; }
.demo-note { max-width: 1040px; margin: 0 auto; padding: 0 20px 8px; font-size: 12px; color: var(--ink-3); }
.demo-main { max-width: 1040px; margin: 0 auto; padding: 20px 20px 64px; }

/* ── 页头 ── */
.page-head { display: flex; justify-content: space-between; align-items: flex-end; gap: 12px; margin: 4px 0 16px; }
.page-title { font-size: 20px; font-weight: 700; color: var(--ink); }
.page-sub { margin-top: 4px; font-size: 12.5px; color: var(--ink-3); }
.empty { padding: 48px 0; text-align: center; color: var(--ink-3); }

/* ── 月刊正文 ── */
.monthly-layout { display: block; }
.monthly-doc { background: var(--white); border: 1px solid var(--line); border-radius: 12px; padding: 28px 36px 36px; }
.monthly-cover { text-align: center; padding: 28px 0 30px; margin-bottom: 8px; border-bottom: 2px solid var(--orange); }
.monthly-cover-en { font-family: var(--mono); font-size: 12px; letter-spacing: 4px; color: var(--orange-2); }
.monthly-cover-cn { margin: 8px 0; font-size: 28px; font-weight: 800; letter-spacing: 3px; color: var(--ink); }
.monthly-cover-meta { font-size: 12.5px; color: var(--ink-3); }

.monthly-chapter { display: flex; align-items: center; gap: 12px; margin: 34px 0 16px; padding-bottom: 10px; border-bottom: 1px solid var(--line); }
.monthly-chapter-num { flex: none; width: 34px; height: 34px; display: grid; place-items: center; border-radius: 8px; background: var(--orange); color: #fff; font-weight: 700; font-size: 16px; }
.monthly-chapter h2 { font-size: 18px; font-weight: 700; color: var(--ink); }
.monthly-chapter .ch-sub { margin-left: auto; font-family: var(--mono); font-size: 11px; letter-spacing: 1.5px; color: var(--ink-4); }

/* 正文段落是纯文字:段与段之间空一行,列表项各占一行 */
.monthly-overview, .policy-content-text, .tip-box p { white-space: pre-line; overflow-wrap: anywhere; }
.monthly-overview { padding: 16px 20px; margin-bottom: 12px; background: #fffaf5; border: 1px solid var(--orange-soft-2); border-radius: 10px; font-size: 14px; line-height: 1.9; color: var(--ink-2); }

.overview-table { width: 100%; border-collapse: collapse; font-size: 13px; line-height: 1.6; border: 1px solid var(--line); }
.overview-table th { background: var(--orange); color: #fff; font-weight: 600; text-align: left; padding: 9px 12px; white-space: nowrap; }
.overview-table td { padding: 9px 12px; border-top: 1px solid var(--line-2); color: var(--ink-2); vertical-align: top; }
.overview-table tbody tr:nth-child(even) td { background: #fcfcfd; }
.overview-table .col-cat, .overview-table tbody tr:nth-child(even) td.col-cat { background: var(--orange-soft); color: var(--orange-2); font-weight: 600; white-space: nowrap; }

.policy-block { position: relative; margin-bottom: 18px; padding: 22px 26px; background: var(--white); border: 1px solid var(--line); border-radius: 10px; }
.policy-block-num { position: absolute; top: 16px; right: 22px; font-family: var(--mono); font-size: 28px; font-weight: 700; color: var(--orange-soft-2); }
.policy-block h3 { padding-right: 56px; margin-bottom: 10px; font-size: 16px; line-height: 1.5; font-weight: 700; color: var(--ink); }
.policy-section-tag { display: inline-block; margin: 12px 0 8px; padding: 2px 9px; border-radius: 4px; font-size: 12px; font-weight: 600; color: #fff; background: var(--ink-2); }
.policy-section-tag.info { background: var(--blue); }
.policy-section-tag.content { background: var(--ink-2); }
.policy-section-tag.focus { background: var(--orange-2); }
.policy-content-text { font-size: 14px; line-height: 1.85; color: var(--ink-2); }
.policy-content-list { margin: 6px 0; padding-left: 20px; font-size: 14px; line-height: 1.85; color: var(--ink-2); }

.tip-box { margin: 12px 0; padding: 12px 16px; background: var(--orange-soft); border: 1px solid var(--orange-soft-2); border-left: 4px solid var(--orange); border-radius: 8px; }
.tip-box-label { display: flex; align-items: center; gap: 6px; margin-bottom: 6px; font-size: 12.5px; font-weight: 700; color: var(--orange-2); }
.tip-box-label .tb-icon { width: 18px; height: 18px; display: grid; place-items: center; border-radius: 50%; background: var(--orange); color: #fff; font-size: 11px; }
.tip-box p { font-size: 13.5px; line-height: 1.8; color: var(--ink-2); }
.tip-box.insight { background: var(--teal-soft); border-color: var(--teal-line); border-left-color: var(--teal); }
.tip-box.insight .tip-box-label { color: var(--teal); }
.tip-box.insight .tb-icon { background: var(--teal); }
.tip-box.warn { background: var(--red-soft); border-color: var(--red-line); border-left-color: var(--red); }
.tip-box.warn .tip-box-label { color: var(--red); }
.tip-box.warn .tb-icon { background: var(--red); }

.btn { font: inherit; font-size: 13px; padding: 7px 14px; border-radius: 8px; border: 1px solid var(--line); background: var(--white); color: var(--ink-2); cursor: pointer; }
.btn-primary { background: var(--orange); border-color: var(--orange); color: #fff; font-weight: 600; }
.btn-primary:hover:not(:disabled) { background: var(--orange-2); border-color: var(--orange-2); }
.btn:disabled { opacity: .5; cursor: not-allowed; }
textarea { font: inherit; color: var(--ink); }
textarea:focus, .btn:focus-visible, .monthly-card:focus-visible, .demo-nav a:focus-visible { outline: 2px solid var(--orange-line); outline-offset: 2px; }

/* ── 列表卡片 ── */
.monthly-card { display: flex; gap: 22px; margin-bottom: 14px; padding: 20px 22px; background: var(--white); border: 1px solid var(--line); border-radius: 12px; cursor: pointer; transition: box-shadow .15s, border-color .15s; }
.monthly-card:hover { border-color: var(--orange-line); box-shadow: 0 6px 18px -8px rgba(17, 24, 39, .18); }
.monthly-card.latest { border-left: 4px solid var(--orange); }
.monthly-card-date { flex: none; width: 82px; height: 82px; display: flex; flex-direction: column; align-items: center; justify-content: center; border-radius: 12px; background: var(--orange-soft); color: var(--orange-2); }
.monthly-card-date .y { font-family: var(--mono); font-size: 11px; color: var(--ink-3); }
.monthly-card-date .m { font-size: 28px; font-weight: 800; line-height: 1.1; }
.monthly-card-date .mtag { font-family: var(--mono); font-size: 10px; letter-spacing: 2px; }
.monthly-card-main { flex: 1; min-width: 0; }
.monthly-card-meta { display: flex; align-items: center; gap: 8px; margin-bottom: 6px; font-size: 12px; color: var(--ink-3); }
.monthly-card-title { margin-bottom: 6px; font-size: 17px; font-weight: 600; color: var(--ink); }
.monthly-card-summary { margin-bottom: 10px; font-size: 13px; line-height: 1.7; color: var(--ink-2); }
.monthly-card-tags { display: flex; flex-wrap: wrap; gap: 6px; }
.monthly-card-count { flex: none; display: flex; flex-direction: column; justify-content: center; padding-left: 20px; border-left: 1px solid var(--line); text-align: right; font-size: 11px; line-height: 1.8; color: var(--ink-3); }
.tag { font-size: 12px; padding: 1px 9px; border-radius: 999px; background: var(--line-2); color: var(--ink-2); }
.tag-orange { background: var(--orange-soft); color: var(--orange-2); }
.pill { font-size: 11px; font-weight: 600; padding: 1px 8px; border-radius: 999px; }
.pill-amber { background: #fef3c7; color: #92400e; }
.pill-green { background: #dcfce7; color: #166534; }

/* ── 窄屏 ── */
@media (max-width: 720px) {
  .demo-bar-inner, .demo-note { padding-left: 16px; padding-right: 16px; }
  .demo-nav { margin-left: 0; }
  .demo-main { padding: 14px 16px 48px; }
  .monthly-doc { padding: 16px 14px 24px; border-radius: 10px; }
  .monthly-cover-cn { font-size: 22px; }
  .monthly-chapter .ch-sub { display: none; }
  .overview-table { display: block; overflow-x: auto; }
  .policy-block { padding: 16px 14px; }
  .monthly-card { flex-direction: column; gap: 12px; padding: 16px; }
  .monthly-card-date { width: auto; height: auto; flex-direction: row; gap: 8px; padding: 6px 12px; justify-content: flex-start; }
  .monthly-card-count { flex-direction: row; gap: 8px; padding-left: 0; border-left: 0; text-align: left; }
  .monthly-card-count br { display: none; }
}

.toast-host[data-v-5e4d2c73]{position:fixed;top:16px;right:16px;z-index:9999;display:grid;gap:8px;max-width:min(360px,calc(100vw - 32px))}.toast[data-v-5e4d2c73]{padding:10px 14px;border-radius:8px;font-size:13px;color:#fff;background:#16a34a;box-shadow:0 6px 18px #0f172a2e}.toast.error[data-v-5e4d2c73]{background:#dc2626}.toast.warning[data-v-5e4d2c73]{background:#d97706}.toast.info[data-v-5e4d2c73]{background:#2563eb}

</style>

<script type="application/json" id="demo-data">{"2026-07":{"id":"2026-07","type":"MONTHLY","title":"能源政策月刊 · 2026 年 7 月","year":2026,"month":7,"coverDate":"2026-07-01","publishDate":"2026-08-06","status":"PUBLISHED","version":1,"content":{"schema":"monthly.v2","month":"2026-07","narrative":"","overview":"7月是\"十五五\"能源政策从顶层设计转入执行部署的关键月份。国务院7月5日印发《\"十五五\"碳达峰行动方案》（国发〔2026〕22号），给出2030年碳达峰冲刺期的总纲：单位GDP二氧化碳排放较2025年降低17%、非化石能源消费占比达到25%。国家能源局《能源领域节能降碳行动计划（2026—2028年）》（国能发规划〔2026〕45号）7月10日公开发布，把顶层目标分解为2028年前的行业任务，充电网络、储能、绿电交易全部在列。国家发展改革委、国家能源局7月6日印发《可再生能源发展\"十五五\"规划》（发改能源〔2026〕1067号），与6月的《新型能源体系建设\"十五五\"规划》衔接成套。价格端，国家发展改革委7月8日印发第四监管周期省级电网输配电价（发改价格〔2026〕1077号），8月1日起执行，贵州、四川、山西月末密集发文落地——全国电力成本基线三年一度的重置正式启动。（涉及内部信息，个人版已隐去）。\n\n财税条线在本月发出明确的退坡信号：财政部、税务总局、工业和信息化部公告自2027年1月1日起取消节能汽车车船税减半和纯电动商用车、插电式混动、燃料电池商用车免征；财政部、税务总局同步对电力等能源行业沿用三十余年的城镇土地使用税老减免安排\"一年减半、次年全征\"退出。新能源车与能源基础设施的税收优惠期正在收尾。\n\n地方层面，上海印发绿电直连有序发展工作方案，就公开信息看是发改能源〔2026〕688号多用户绿电直连新政后一线城市首个系统性落地方案；内蒙古和林格尔绿电园区的落地三步（基础设施方案印发、增量配电网纳入自治区电网规划、牵头企业竞争性优选）在7月集中披露，园区级\"增量配电网＋新能源＋储能＋售电\"一体化模板成型。充电侧准入与合规密集变化：湖南将大额民企充换电项目备案上收省级并打捆办理，充电桩CCC认证8月1日起强制实施，上海公示年度共享充电小区与统建统营小区建设计划。","businessTakes":[{"business":"加油","text":"碳达峰方案再次确认\"稳步实现煤炭和石油消费达峰\"，并部署生物柴油、绿色氢氨醇等绿色燃料在交通领域的替代路径，中长期油品需求判断应保持审慎；能源行业土地使用税老减免退出后，加油站等经营性场站用地无新增优惠，持有成本测算需同步更新。"},{"business":"充电","text":"需求与标准双重利好：碳达峰方案设定2030年新能源汽车保有量占比力争30%，节能降碳行动计划明确\"快充为主、慢充为辅、大功率充电为有益补充\"的城市公共充电网络定位，并要求对重大节假日利用率超40%的场站率先大功率改造；但合规与成本端同步收紧：车船税优惠2027年起退坡、CCC认证8月1日强制实施、湖南等地备案口径调整。"},{"business":"电力","text":"（储能·V2G·交易）本月信号最密：输配电价重定价改写储能与交易的成本基线；碳达峰方案给出新型储能力争3亿千瓦、虚拟电厂调节能力5000万千瓦以上、需求响应能力不低于最大负荷5%的量化目标；节能降碳行动计划部署绿证价格指数、多年期绿电合同与聚合交易，配套的消纳责任权重实施办法8月1日施行；（涉及内部信息，个人版已隐去）；上海绿电直连方案打开园区侧售电与聚合参与市场的新入口，且明确8月15日前申报首批项目。"}],"quickTable":[{"no":"01","level":"国家级","score":"5分","title":"\"十五五\"碳达峰行动方案","issuer":"国务院","date":"07-09发布","doc_no":"国发〔2026〕22号"},{"no":"02","level":"国家级","score":"5分","title":"内部文件（个人版已隐去）","issuer":"（个人版已隐去）","date":"内部","doc_no":""},{"no":"03","level":"国家级","score":"5分","title":"可再生能源发展\"十五五\"规划","issuer":"国家发展改革委、国家能源局","date":"07-23发布","doc_no":"发改能源〔2026〕1067号"},{"no":"04","level":"国家级","score":"4分","title":"能源领域节能降碳行动计划（2026—2028年）","issuer":"国家能源局","date":"07-10发布","doc_no":"国能发规划〔2026〕45号"},{"no":"05","level":"国家级","score":"4分","title":"第四监管周期省级电网输配电价、区域电网输电价格","issuer":"国家发展改革委","date":"07-10发布","doc_no":"发改价格〔2026〕1077号"},{"no":"06","level":"国家级","score":"3分","title":"调整节能汽车、新能源汽车车船税优惠政策的公告","issuer":"财政部、税务总局、工业和信息化部","date":"07-02成文","doc_no":"2026年第19号"},{"no":"07","level":"国家级","score":"3分","title":"调整部分能源资源行业企业城镇土地使用税政策的公告","issuer":"财政部、税务总局","date":"07-27成文","doc_no":"2026年第22号"},{"no":"08","level":"国家级","score":"3分","title":"电动汽车供电设备CCC认证强制实施","issuer":"市场监管总局（国家认监委）","date":"08-01实施","doc_no":""},{"no":"09","level":"地方","score":"","title":"绿电直连有序发展工作方案","issuer":"上海市","date":"07-17","doc_no":"沪发改能源〔2026〕140号"},{"no":"10","level":"地方","score":"","title":"和林格尔绿电园区牵头企业竞争性优选公告","issuer":"内蒙古","date":"07-27","doc_no":""},{"no":"11","level":"地方","score":"","title":"第四监管周期省级输配电价落地文件","issuer":"黔·川·晋","date":"07月末","doc_no":""},{"no":"12","level":"地方","score":"","title":"充换电基础设施投资项目备案管理","issuer":"湖南省","date":"07-02","doc_no":"湘发改能源规〔2026〕378号"},{"no":"13","level":"地方","score":"","title":"共享充电小区及\"统建统营\"小区建设计划公示","issuer":"上海市","date":"07-24","doc_no":""},{"no":"14","level":"地方","score":"","title":"四川电力市场结算细则V1.0调整优化","issuer":"四川省","date":"07-10","doc_no":"川发改价格函〔2026〕291号"},{"no":"15","level":"地方","score":"","title":"第二批可再生能源和新能源专项资金目录","issuer":"上海市","date":"07-16","doc_no":"沪发改能源〔2026〕139号"},{"no":"16","level":"地方","score":"","title":"《电动汽车充电基础设施技术标准》修订征求意见","issuer":"山西省","date":"07-01","doc_no":""}],"details":[{"no":"01","policyId":"","title":"\"十五五\"碳达峰行动方案（2026-07-09发布）","info":"关键词：碳达峰冲刺·煤油达峰·新型储能·虚拟电厂·绿电直连·零碳园区·新能源汽车保有量·算力绿电直供\n\n发文机关：国务院\n\n成文日期：2026-07-05　·　发布日期：2026-07-09　·　文号：国发〔2026〕22号（政府网公开文本有删减）\n\n方案依据生态环境法典和《碳达峰碳中和综合评价考核办法》制定，是\"十五五\"时期碳达峰工作的总部署，设定到2030年：单位国内生产总值二氧化碳排放比2025年降低17%，非化石能源消费占比达到25%。\n\n与公司业务最相关的原文表述（摘录）：\n\n- \"稳步实现煤炭和石油消费达峰\"\"积极推进绿色氢氨醇、生物柴油、可持续航空燃料等绿色燃料应用\"\"稳妥推动工业领域动力、热力用油替代\"\n- \"到2030年，风电和太阳能发电总装机容量达到28亿千瓦以上\"\"加快推进新增用电量由新增清洁能源电量覆盖\"\n- \"积极发展绿电直连、新能源就近接入增量配电网等绿电直供模式，推动源网荷储一体化发展\"\n- \"推动新型储能规模化发展，大力发展长时储能……到2030年，抽水蓄能装机容量达到1.6亿千瓦左右，新型储能装机容量力争达到3亿千瓦，全国虚拟电厂最大调节能力达到5000万千瓦以上，电力需求响应能力达到最大用电负荷的5%以上\"\n- \"持续增加新能源汽车保有量，加快公共领域车辆电动化……完善充换电、绿色氢氨醇加注等补能设施……到2030年，新能源汽车保有量占比力争达到30%，新能源营运交通工具保有量占比达到25%\"\n- \"支持新能源重卡规模化应用\"\"聚焦货运量大的国家高速公路和普通国道建设零碳公路运输通道\"\n- \"强化算力设施与可再生能源协同布局，支持开展绿电直供……推动新建算力设施主要使用非化石能源电力\"\n- \"\"十五五\"期间，建设100个左右国家级零碳园区和500个左右零碳工厂\"\"鼓励零碳园区存量负荷开展绿电直连\"\n- \"完善体现分时价值差异的零售市场价格机制，探索建立反映调节能力的需求响应价格机制\"\n- \"发挥碳市场支撑作用……逐步覆盖石化、化工等行业\"","reading":"方案是碳达峰领域行政效力最高的执行文件，三点值得注意：\n\n1. 目标从\"强度约束\"走向\"总量冲刺\"。17%的碳强度降幅与25%的非化石能源占比，配合\"新增用电量由新增清洁能源电量覆盖\"，意味着化石能源增量空间在\"十五五\"内被制度性封顶；煤炭、石油消费达峰从方向性表述变为执行任务。\n2. 电力系统调节资源首次给齐量化包：新型储能3亿千瓦、抽蓄1.6亿千瓦、虚拟电厂5000万千瓦、需求响应5%。四个数字共同定义了2030年灵活性资源的市场总盘子，是储能、V2G、负荷聚合业务中期空间测算的权威基准。\n3. 省级传导已经启动。方案明确\"各省（自治区、直辖市）要制定省级'十五五'碳达峰行动方案\"，并按《碳达峰碳中和综合评价考核办法》开展综合评价考核——在考核压力传导下，未来两个季度将出现一轮省级方案密集出台，属地政策窗口将逐省打开。","focus":"1. 省级碳达峰方案出台节奏——省级方案将把30%保有量、储能、绿电直连等目标翻译成属地指标，是公司各地业务争取政策资源的直接依据。重点跟踪广东、江苏、山东、四川等业务重点省份。 [B 研究/跟进]\n2. 零碳园区与算力绿电直供的项目化机会——100个国家级零碳园区和\"新建算力设施主要使用非化石能源电力\"的要求，将催生一批园区级绿电直连、储能配套需求，与本月上海、内蒙古的落地动作互为印证。 [B 研究/跟进]\n3. 分时价格与需求响应价格机制——\"完善体现分时价值差异的零售市场价格机制\"直接关联充电场站峰谷策略与储能套利空间，关注国家层面细则及各省跟进。 [A 趁早行动]","advice":[{"business":"加油","tag":"","text":"油品消费达峰已由方向变为部署，网络布局与资产投入的中长期测算建议按\"十五五\"内达峰情景校准；绿色燃料（生物柴油、绿色氢氨醇）在交通领域的替代路径值得纳入观察清单。"},{"business":"充电","tag":"","text":"2030年保有量30%目标叠加公共领域电动化提速，需求端中期确定性进一步加强；新能源重卡与零碳公路运输通道属宏观背景，作节奏参考。"},{"business":"电力","tag":"","text":"以3亿千瓦储能、5000万千瓦虚拟电厂、5%需求响应为总盘子重估中期空间；碳市场扩容至石化化工亦将抬升工商业用户绿电采购需求，利好绿电交易撮合。"}]},{"no":"02","policyId":"","title":"内部文件（个人版已隐去）","info":"（这一节解读的是一份经内部渠道获取、未公开的材料，个人版已隐去原文。）","reading":"（这一节解读的是一份经内部渠道获取、未公开的材料，个人版已隐去原文。）","focus":"（这一节解读的是一份经内部渠道获取、未公开的材料，个人版已隐去原文。）","advice":[]},{"no":"03","policyId":"","title":"可再生能源发展\"十五五\"规划（2026-07-23发布）","info":"关键词：可再生能源·五年规划·顶层三件套\n\n发文机关：国家发展改革委、国家能源局\n\n成文日期：2026-07-06　·　发布日期：2026-07-23　·　文号：发改能源〔2026〕1067号\n\n印发通知明确，规划依据《中华人民共和国国民经济和社会发展第十五个五年规划纲要》和《新型能源体系建设\"十五五\"规划》编制，印发对象为各省级发展改革、能源主管部门，国家能源局各派出机构及有关中央企业。需要说明：本次公开文本为印发通知，规划全文以附件形式发布，配套发布了答记者问与图解。","reading":"规划与6月印发的《新型能源体系建设\"十五五\"规划》（发改能源〔2026〕884号）、本月国务院碳达峰行动方案构成\"十五五\"能源政策的顶层三件套：碳达峰方案定总量与时点，新型能源体系规划定体系架构，本规划定可再生能源的开发、消纳与机制安排；节能降碳行动计划则是三者之下的行业执行层。碳达峰方案中\"风光28亿千瓦\"\"新增用电量由新增清洁能源电量覆盖\"等目标的实施路径，预计将在本规划中细化展开。","focus":"1. 规划全文的消纳与电价机制章节——可再生能源消纳责任、绿证绿电制度安排直接影响电力交易业务的标的供给。 [B 研究/跟进]\n2. 分布式可再生能源的支持口径——涉及充电场站配套光伏、园区绿电直连的电源侧条件。 [C 跟踪]","advice":[{"business":"电力","tag":"","text":"在规划全文基础上重估\"十五五\"绿电交易市场供给侧扩容节奏；结合碳达峰方案的消纳目标，优先研判业务所在省份的消纳责任权重变化。"}]},{"no":"04","policyId":"","title":"能源领域节能降碳行动计划（2026—2028年）（2026-07-10发布）","info":"关键词：快充为主·大功率充电·长时储能·绿证价格指数·全国统一电力市场·算电协同\n\n发文机关：国家能源局\n\n成文日期：2026-06-26　·　发布日期：2026-07-10　·　文号：国能发规划〔2026〕45号\n\n行动计划印发至各省能源主管部门、北京市城管委及主要能源央企，是能源行业落实节能降碳要求的三年执行文件。到2028年目标：非化石能源消费比重年均提升约1个百分点；达到现行能效标杆水平的煤电产能比例力争提高15个百分点；建成一批零碳低碳煤炭矿区、油区；支持建成一批零碳园区。\n\n与公司业务最相关的原文表述（摘录）：\n\n- \"大力发展新型储能，探索长时储能应用，增加省间新能源互济交易规模\"\"积极发展绿电直连、智能微电网、源网荷储一体化、新能源接入增量配电网等新能源就近消纳新业态\"\n- \"建设快充为主、慢充为辅、大功率充电为有益补充的城市公共充电网络，加强高速公路沿线大功率充电设施、电动重卡充换电设施建设，率先对重大节假日期间利用率超过40%的充电设施实施大功率改造\"\n- \"推动新能源基地与算力设施协同规划、建设\"\"深入挖掘算力负荷时空可调节潜力，促进算电协同运行\"\n- \"持续扩大绿色电力证书……市场，发布绿证价格指数，引导绿证价格在合理区间运行\"\"推动绿证纳入碳排放核算体系\"\n- \"完善全国统一电力市场体系，充分利用各省区电力供需时段和调节能力的差异，促进清洁能源在更大范围内消纳\"\"推动发用侧双方以多年期交易合同、聚合交易等方式开展绿电交易\"","reading":"行动计划把节能降碳的行业任务压缩到2026—2028三年窗口，比五年规划更贴近项目与考核，三点增量明显：\n\n1. 充电网络第一次在国家级文件中细化到运营指标。\"快充为主、慢充为辅、大功率充电为有益补充\"确立了公共充电网络的技术路线，而\"重大节假日期间利用率超过40%的充电设施率先实施大功率改造\"更是把改造优先级直接挂钩利用率数据——这是可以逐站对表的工程标准，也是补贴与改造支持大概率的锚定口径。\n2. 绿电交易的机制工具箱成型：绿证价格指数、多年期交易合同、聚合交易三个机制词首次在同一文件中并列部署，配套的《可再生能源消费最低比重目标和可再生能源电力消纳责任权重制度实施办法》（国家发展改革委2026年第42号令）已定于8月1日施行——消纳责任从\"鼓励\"转为\"义务\"，工商业用户的绿电采购需求将刚性化。\n3. 算电协同从概念进入部署：新能源基地与算力设施协同规划、算力负荷时空可调节潜力挖掘，与本月和林格尔园区优选、上海绿电直连的算力优先场景形成国家与地方的呼应。","focus":"1. 节假日利用率超40%场站的大功率改造清单——公司高利用率场站可对照该标准自查，提前完成改造方案储备，争取纳入支持范围。 [A 趁早行动]\n2. 42号令8月1日施行后的首轮消纳责任权重指标——权重分解到省、传导到重点用能企业的节奏，决定绿电交易需求释放的快慢。 [B 研究/跟进]\n3. 绿证价格指数的发布主体与频率——将成为绿电交易定价的公开基准。 [C 跟踪]","advice":[{"business":"充电","tag":"","text":"以\"快充为主＋节假日40%利用率\"两条标准复核在营场站与投资清单，高速沿线与高利用率城市场站按大功率改造预留容量与电力接入条件。"},{"business":"电力","tag":"","text":"省间互济扩容、统一市场建设与聚合交易为交易业务扩大标的与模式空间；消纳责任权重施行后，围绕重点用能企业的绿电采购撮合与多年期合同设计可提前布局。"}]},{"no":"05","policyId":"","title":"第四监管周期省级电网输配电价（2026-07-10发布）","info":"关键词：输配电价·第四监管周期·8月1日执行·成本基线\n\n发文机关：国家发展改革委\n\n成文日期：2026-07-08　·　发布日期：2026-07-10　·　文号：发改价格〔2026〕1077号\n\n通知按照输配电定价成本监审办法及省级电网输配电价定价办法等规定（发改价格规〔2025〕1490号），核定第四监管周期省级电网输配电价、区域电网输电价格，自2026年8月1日起执行；具体价格以附件《省级电网输配电价表》《第四监管周期区域电网输电价格表》为准。通知同时要求电网企业对资产、费用、输配售电量、负荷、线损率等基础数据统计归集，每年5月底前报送。\n\n省级落地在月末密集展开：贵州省发展改革委7月27日印发黔发改价格〔2026〕421号，四川省发展改革委7月29日、山西省发展改革委7月31日相继发文，三省文件均以1077号文为直接依据；甘肃据兰州市发展改革部门消息，新价格同样自8月1日起正式执行，监管周期为三年。","reading":"输配电价是电价中的\"过网成本\"，三年一个监管周期。第四监管周期价格表8月1日生效，意味着全国工商业用户的电力成本基线整体重置：充电场站的购电成本、储能项目的充放价差、电力交易的输配环节费用全部需要按新价表重算。省级发文节奏之快（国家文件印发后三周内多省完成落地）显示本轮执行刚性强。","focus":"1. 分省新价表获取与测算更新——价格表未随正文公开，需逐省取得电价表后重跑储能收益与充电场站电费模型；市场机构普遍解读本轮为\"电量电价下调、容（需）量电价上调\"的结构性调整，若属实，低负荷率用户（充电场站属典型）可能出现账单不降反升的分化，务必以分省价表验证该方向并优先测算场站影响。 [A 趁早行动]\n2. 各省销售电价与分时电价联动调整——输配电价调整通常伴随工商业分时电价目录同步修订，直接决定峰谷价差走向。 [A 趁早行动]","advice":[{"business":"电力","tag":"","text":"8月1日新价执行后，尽快完成业务所在省份储能套利与交易过网成本的重测；把输配电价变动纳入与用户的长协定价条款。"},{"business":"充电","tag":"","text":"按\"容量成本占比上升\"的不利情景先行压力测试场站电费，核对各运营省份场站电费构成变化，评估是否需要调整服务费定价、变压器容量申报与谷段运营策略。"}]},{"no":"06","policyId":"","title":"车船税优惠政策调整（2026-07-02成文）","info":"关键词：车船税·优惠退坡·2027年起执行\n\n发文机关：财政部、税务总局、工业和信息化部\n\n成文日期：2026-07-02　·　文号：财政部 税务总局 工业和信息化部公告2026年第19号\n\n公告原文的核心一句：\"自2027年1月1日起，取消对节能汽车减半征收车船税政策，取消对纯电动商用车、插电式（含增程式）混合动力汽车、燃料电池商用车免征车船税政策\"；此前已取得的上述车辆同样恢复征税，财税〔2018〕74号相应条款同时废止。公告未涉及纯电动乘用车——依据车船税法，纯电动乘用车、燃料电池乘用车本不属于车船税征税范围，不存在恢复征税问题。","reading":"这是新能源汽车税收优惠体系进入退坡通道的第一个明确文件：给了半年过渡期，且退坡对象集中在商用车与插混。对运营车辆而言，纯电动商用车（含运营用轻型车、大巴等）2027年起恢复缴纳车船税，持有成本小幅抬升；插混车型无论用途均恢复征税。纯电动乘用车的税收地位不受影响。","focus":"1. 购置税优惠等其余新能源车税收政策的后续走向——车船税先行退坡后，需关注2027年到期政策的接续安排，判断整体优惠退出节奏。 [B 研究/跟进]","advice":[{"business":"充电","tag":"","text":"插混车型持有成本2027年起上升，对纯电与插混的相对经济性构成边际利好纯电的变化，中期充电需求结构可据此微调预测；商用车影响作宏观背景纳入行业观察。"}]},{"no":"07","policyId":"","title":"能源行业城镇土地使用税调整（2026-07-27成文）","info":"关键词：土地使用税·老减免退出·基础设施免征清单\n\n发文机关：财政部、税务总局\n\n成文日期：2026-07-27　·　文号：财政部 税务总局公告2026年第22号\n\n公告两项安排：其一，对按（89）国税地字第013号等老文件减免城镇土地使用税的土地，自2026年9月1日至2027年8月31日按应纳税额减半征收，自2027年9月1日起全额征收，老文件同时废止。其二，自2026年9月1日起新设免征清单，覆盖油气生产的防灾与厂外道路用地、油气长输管道线路用地、水电站水库大坝等设施用地、核电站堤防护坡、火电厂厂外铁路公路、供电企业输电线路用地、煤炭与矿山企业安全区用地等八类，项目建设期间同等免征。","reading":"沿用三十余年的能源行业土地使用税普惠性减免正式退出，代之以\"网络型、安全型基础设施\"的精准免征清单。电力行业中仅输电线路等网络设施保留免税，电厂厂区、经营性场站用地回归全额征税。充电站、储能电站、加油站用地均不在免征清单内，经营性能源场站无新增优惠。整体信号与车船税公告一致：能源领域税收优惠从普惠转向定向。","focus":"1. 2026年9月1日减半征收启动时点——涉及自持能源资产的税负测算调整。 [C 跟踪]","advice":[{"business":"电力","tag":"","text":"自持储能电站、场站类资产的用地税负按全额征收情景更新持有成本模型；评估租赁模式与自持模式的税负差异。"}]}],"localRoundup":"本月地方文件集中在绿电直连、园区配售电与充电准入三条线，多数是对国家方向的省级承接。其中上海绿电直连方案、内蒙古和林格尔园区优选两件对公司最有操作价值，单列说明；其余并入速览。\n\n1. 上海市绿电直连有序发展工作方案（沪发改能源〔2026〕140号，2026-07-17，上海市发展改革委）\n\n关键词：绿电直连·多用户·算力优先·60%自发自用·8月15日首批申报\n\n承接国家级：贯彻发改能源〔2025〕650号、发改价格〔2025〕1192号、发改能源〔2026〕688号，就公开信息看是多用户绿电直连新政后一线城市首个系统性落地方案。目标至2030年电源侧开发规模50万千瓦。硬约束给得很实：并网型项目新能源年自发自用电量占总可用发电量不低于60%、占总用电量不低于30%（2030年前不低于35%），接入电压等级原则上不超过220千伏，消纳困难时段不得向公共电网反送电。\n\n对公司业务：三个设计值得抓住——电网企业被明确排除在投资主体之外且项目负荷不得由电网代理购电，为第三方能源服务商留出空间；项目\"作为整体参与市场＋内部主体可聚合注册\"，主责单位实质承担园区级售电与聚合商角色；场景上\"优先支持算力设施、绿色氢氨醇等新兴产业\"，与公司数据中心类客户资源匹配。充电场站作为可调节负荷纳入项目负荷侧的可行性值得专项论证。各区8月15日前申报首批项目，时间很紧，具备电源或负荷资源的合作方需立即锁定。[A 趁早行动]\n\n2. 和林格尔绿电园区电力基础设施项目牵头企业竞争性优选（内能源电力字〔2026〕340号等，2026-07-27，呼和浩特市发展改革委）\n\n关键词：增量配电网·园区售电·算电协同·竞争性优选\n\n落地三步在7月集中披露：自治区能源局印发《和林格尔绿电园区电力基础设施方案（1.0版）》、同意园区增量配电网纳入自治区电网规划（6月23日同意，7月3日经市发展改革委对外发布），7月27日发布牵头企业竞争性优选公告。园区增量配电网规划范围73.15平方公里，负荷按近期86万千瓦、中期168万千瓦、远期320万千瓦考虑，主要满足算力企业电力需求。入选企业组建资产管理公司，负责园区内增量配电网、新能源、储能的投资建设，并作为园区售电主体；2026年12月底前开工，2027年底前取得电力业务许可证。\n\n对公司业务：这是目前公开信息中要素最完整的园区级\"源网荷储售\"一体化样本——增量配电网＋新能源＋储能＋售电权打包给单一市场化主体，且以竞争性优选而非行政指定确定投资人。与上海路径不同（上海走绿电直连专线、内蒙古走增量配电网），方向一致：园区级电力资产的投资运营正在向非电网主体开放。中标方案的配电价格与储能配置规模是同类项目经济性的第一手参照，\"东数西算\"枢纽省份的复制动作值得跟踪。[B 研究/跟进]\n\n3. 其他地方政策合并速览\n\n充电准入与合规三地同步收紧：湖南省发展改革委印发湘发改能源规〔2026〕378号（落款6月25日、7月2日发布），民营企业省内投资额5000万元以上的充换电项目及高速公路服务区项目改由省发展改革委备案、实行打捆申报，有效期三年——大额充电投资的准入信息向省级集中，与省级部门的对接价值上升；上海依据沪发改能源〔2026〕97号，市发展改革委、市房屋管理局7月24日公示年度共享充电小区及\"统建统营\"小区建设计划，居住区充电市场的划分正在名单制化；山西省住建厅7月1日就地方标准《电动汽车充电基础设施技术标准》修订公开征求意见。四川省发展改革委、省能源局7月10日印发川发改价格函〔2026〕291号，调整优化《四川电力市场结算细则V1.0》，影响入市主体的结算口径。输配电价省级落地已在前节述及。资金与项目侧：上海7月16日公布第二批可再生能源和新能源专项资金目录（沪发改能源〔2026〕139号），覆盖光伏建筑一体化、光伏电站、企业及居民分布式光伏等五类，7月6日另公示第一批拨付计划草案；湖南7月15日批复大中赫锂矿年产20GWh储能电池及配套新材料项目节能报告；沈阳7月23日发布第二批风电项目竞争性配置公告；重庆（北碚）7月24日、兰州7月8日分别公示第三季度分布式光伏可开放容量与承载力评估结果——分布式光伏可开放容量的季度公示已在多城市固定下来，接网资源稀缺性被显性化，建议纳入场站选址与储能配置的前置校验。","appendix":"以下动向的正式文本尚待取得或发布时间贴近本期边界，据公开信息提示提前关注：\n\n1. 《新型电力系统建设\"十五五\"规划》——据公开报道，国家发展改革委、国家能源局8月3日印发。作为\"十五五\"能源顶层文件的电力系统分册，对储能、虚拟电厂、电力市场建设的部署预计更为具体，下期将作重点详析。\n2. 部分电池消费税政策调整——财政部、海关总署、税务总局7月中旬发布公告，涉及电池类产品消费税安排调整，与储能、动力电池成本直接相关，待取得公告全文后评估影响。\n3. 废旧动力电池梯次利用政策调整——据公开信息，工业和信息化部7月30日公告不再开展梯次利用企业公告管理，并禁止废旧动力电池以电池包、模块、单体形式用于电动自行车等领域，相关标准将废止或修订。涉及储能项目的梯次电池采购合规与电池资产处置路径，待取得公告原文后专项评估。\n4. 上海深化全球资产管理中心建设的若干意见——其中提出做好电力期货、算力期货的研发准备。电力期货一旦推出，将为电力交易业务提供价格发现与套保工具，属中期结构性变量，建议保持跟踪。","uncovered":"","caveats":[]}},"2026-08":{"id":"2026-08","type":"MONTHLY","title":"能源政策月刊 · 2026 年 8 月","year":2026,"month":8,"coverDate":"2026-08-01","publishDate":"2026-09-15","status":"PUBLISHED","version":1,"content":{"schema":"monthly.v2","month":"2026-08","narrative":"","overview":"8月，\"十五五\"能源专项规划集中公开。《新型电力系统建设\"十五五\"规划》（发改能源〔2026〕942号）8月3日公开，提出到2030年非化石能源发电量占比达到50%，建成可支撑超过1.1亿辆电动汽车出行的充电基础设施网络。《石油天然气发展\"十五五\"规划》（发改能源〔2026〕1055号）8月17日公开，国家能源局次日答记者问，提出推动石油消费达峰、炼油产能\"减量置换\"、\"研究完善成品油消费税和定价机制\"。《煤炭工业发展\"十五五\"规划》（发改能源〔2026〕979号）8月10日公开，定位煤炭为\"基础保障和系统调节\"力量。加上此前印发的《新型能源体系建设\"十五五\"规划》，能源领域的总规划和电力、油气、煤炭三个分册已经齐套。\n\n电力零售市场的规则走向是本月最重要的提前量。（涉及内部信息，个人版已隐去）。市场上多数参与者目前只能从各省动作反推国家意图。\n\n加油与充电两条线的主线是合规执法。市场监管总局8月5日通报上半年民生计量监管情况，充电桩与加油机并列为重点民生计量器具，上半年抽查在用充电桩145829台、不合格1783台，核查在用加油机132906台、问题加油机6489台。","businessTakes":[{"business":"加油","text":"油气规划把石油消费达峰、炼能减量置换、成品油消费税和定价机制研究写进五年安排，批发端的供给格局和税制都进入调整期，折扣空间的中期判断要按此校准。省级细则成片落地，商户的备案与许可合规成本上升。市场监管总局的加油机核查数据可直接用于商户合规预警。"},{"business":"充电","text":"电力规划给出1.1亿辆电动汽车充电网络的五年需求目标，同时部署居住区充电桩报装接电提升和\"统建统服\"试点，公共充电与居住区充电的分工将重新划定。充电桩计量进入常态化执法，福州的三年强检周期是各地执行口径的样本。（涉及内部信息，个人版已隐去）。"},{"business":"电力","text":"（涉及内部信息，个人版已隐去）。四川的辅助服务分摊口径和保底售电启动、湖南输配电价执行，是目标省与已进入省的直接测算输入。分时电价在多省取消，储能项目重启的政策开关短期内不会打开。"}],"quickTable":[{"no":"01","level":"国家级","score":"5分","title":"新型电力系统建设\"十五五\"规划","issuer":"国家发展改革委、国家能源局","date":"08-03发布","doc_no":"发改能源〔2026〕942号"},{"no":"02","level":"国家级","score":"5分","title":"内部文件（个人版已隐去）","issuer":"（个人版已隐去）","date":"内部","doc_no":""},{"no":"03","level":"国家级","score":"4分","title":"石油天然气发展\"十五五\"规划","issuer":"国家发展改革委、国家能源局","date":"08-17发布","doc_no":"发改能源〔2026〕1055号"},{"no":"04","level":"国家级","score":"3分","title":"2026年上半年民生计量监管情况通报","issuer":"市场监管总局","date":"08-05发布","doc_no":""},{"no":"05","level":"地方","score":"","title":"进一步明确电力辅助服务市场费用分摊有关事宜的通知","issuer":"四川省","date":"08-17","doc_no":"川发改价格函〔2026〕332号"},{"no":"06","level":"地方","score":"","title":"分布式光伏发展实施方案（2026—2030年）","issuer":"江苏省","date":"07-29","doc_no":"苏发改能源发〔2026〕695号"},{"no":"07","level":"地方","score":"","title":"四川电力市场2026年保底售电服务工作方案","issuer":"四川省","date":"09-01","doc_no":"川能源〔2026〕47号"},{"no":"08","level":"地方","score":"","title":"省电网第四监管周期输配电价","issuer":"湖南省","date":"07-31","doc_no":"湘发改价调〔2026〕460号"},{"no":"09","level":"地方","score":"","title":"成品油流通管理实施细则（西藏公布、辽宁征求意见）","issuer":"西藏·辽宁","date":"08-01 / 08-10","doc_no":""},{"no":"10","level":"地方","score":"","title":"多用户绿电直连实施方案征求意见、绿电直连进展发布会","issuer":"辽宁·山东","date":"08-04 / 08-18","doc_no":""},{"no":"11","level":"地方","score":"","title":"电动汽车充电桩强制检定告知书","issuer":"福州市","date":"08-11","doc_no":""},{"no":"12","level":"地方","score":"","title":"2025年度充换电基础设施验收及补贴申报公告","issuer":"海口市","date":"08-07","doc_no":""}],"details":[{"no":"01","policyId":"","title":"新型电力系统建设\"十五五\"规划（2026-08-03发布）","info":"关键词：非化石发电量50%·28亿千瓦新能源消纳·1.1亿辆电动汽车充电网络·居住区统建统服·风光储充换电站·电力市场化改革\n\n发文机关：国家发展改革委、国家能源局\n\n成文日期：2026-07-21　·　发布日期：2026-08-03　·　文号：发改能源〔2026〕942号\n\n通知依据\"十五五\"规划纲要和《新型能源体系建设\"十五五\"规划》编制，印发至各省级发展改革委、能源局，北京市城市管理委员会，有关企业和电力规划设计总院、水电水利规划设计总院、中国电力企业联合会。规划全文以附件发布，以下据新华社8月3日通稿。\n\n规划提出到2030年初步建成新型电力系统。与公司业务相关的表述（摘录）：\n\n- \"到2030年，非化石能源发电量占比达到50%，实现28亿千瓦以上新能源高水平消纳，建成可支撑超过1.1亿辆电动汽车出行的充电基础设施网络\"\n- 重点任务包括\"促进用电侧协同发展，增强电力系统调节能力……深化电力市场化体制机制改革\"\n- \"将提升居住区充电桩报装接电服务水平，推动实施一批居住区充电设施'统建统服'试点\"\n- \"在高速公路、国省干线及交通廊道区域，优化布局一批风光储充换电站，推动交通与能源基础设施共享共用通道、管廊、杆塔等资源，加强交通基础设施沿线配电网建设\"","reading":"这是\"十五五\"能源顶层文件的电力分册，上期附录已预告。\n\n1. 非化石能源发电量过半，电价的时段差异和天气相关性会进一步放大，现货市场的价差空间随之扩大。这是电力交易业务未来五年的基本面。（涉及内部信息，个人版已隐去）。\n2. 1.1亿辆充电网络是充电业务的需求目标，但规划同时把居住区充电桩报装接电和\"统建统服\"试点列入民生用电服务，居住区充电供给会被制度性推高。私家车用户在小区充电越方便，对公共场站的依赖越低，私家车运营策略要按这一分工调整场站选址和服务设计。\n3. 交通廊道的风光储充换电站把充电与电源、储能捆绑，廊道场站将成为带电源和调节能力的负荷节点。高速场景在现有业务材料中未见安排，是否跟进需业务方裁定。","focus":"1. 规划全文与各省落实安排——1.1亿辆充电网络、非化石发电量占比等指标如何落到省级，是各地争取政策资源的依据。 [B 研究/跟进]\n2. 居住区\"统建统服\"试点城市名单——试点城市的居住区充电供给会率先改善，公共场站的私家车份额要在这些城市优先复核。 [B 研究/跟进]\n3. 交通廊道风光储充换电站的布局主体与运营模式——待业务方裁定高速场景后再定跟进深度。 [C 跟踪]","advice":[{"business":"充电","tag":"","text":"以1.1亿辆网络目标校准中期需求，把居住区\"统建统服\"试点作为反向变量纳入城市级预测，在试点城市优先评估公共场站对私家车用户的留存。"},{"business":"电力","tag":"","text":"以50%非化石发电量、28亿千瓦新能源消纳为五年基本面，重估现货价差的中期空间。"},{"business":"加油","tag":"","text":"电力与交通融合被列为规划重点任务，油转电的政策推力在\"十五五\"内不会减弱，下沉市场的燃油车存量判断应按此校准。"}]},{"no":"02","policyId":"","title":"内部文件（个人版已隐去）","info":"（这一节解读的是一份经内部渠道获取、未公开的材料，个人版已隐去原文。）","reading":"（这一节解读的是一份经内部渠道获取、未公开的材料，个人版已隐去原文。）","focus":"（这一节解读的是一份经内部渠道获取、未公开的材料，个人版已隐去原文。）","advice":[]},{"no":"03","policyId":"","title":"石油天然气发展\"十五五\"规划（2026-08-17发布）","info":"关键词：油气供应4.4亿吨油当量·石油消费达峰·炼油产能减量置换·成品油消费税和定价机制·绿色燃料替代\n\n发文机关：国家发展改革委、国家能源局\n\n成文日期：2026-07-03　·　发布日期：2026-08-17　·　文号：发改能源〔2026〕1055号\n\n通知依据\"十五五\"规划纲要和《新型能源体系建设\"十五五\"规划》制定，印发至各省级发展改革委、能源局和中石油、中石化、中海油、国家管网四家公司。规划全文以附件发布。人民日报8月18日通稿载明的主要目标：到2030年国内油气供应量达4.4亿吨油当量，新增油气长输管道2万公里，全国长输管网达22万公里，天然气储备占全国消费比重超过13%。\n\n国家能源局8月18日答记者问中与加油业务直接相关的表述（摘录）：\n\n- \"绿色低碳发展，就是推动石油消费达峰，促进天然气清洁高效利用\"\n- \"支持绿色燃料发展，补充替代传统石油产品；保持适度富余炼油和石化产能，提升产业国际竞争力，发挥石油安全的产业垫层作用\"\n- \"坚持炼油产能'减量置换'，优化存量、严控新增，持续推进'油转化''油转特''油转材'……推动重点区域炼厂整合重组和落后产能退出，沿海地区打造具有全球竞争力的炼化一体化产业集群，中西部地区立足本地需求和资源条件保障油品稳定供应，支持有特色、有竞争力的中小型炼厂走'专精特新'发展道路\"\n- \"研究完善成品油消费税和定价机制，定期校核跨省天然气管道运输价格\"\n- \"加强反垄断、反不正当竞争和价格监管执法\"","reading":"这是加油业务唯一的五年基准文件。规划正文以上游供给和管网为主，与成品油市场相关的安排主要见于答记者问。\n\n1. 供给端是\"减量置换\"与\"适度富余\"并存。严控新增、淘汰落后、炼厂整合会抬高批发端集中度；保持适度富余的炼油产能又意味着批发市场的供给压力短期不会消失。本刊的推论是：集中度上升压缩折扣空间，富余产能维持折扣空间，要按区域分别判断。规划对\"适度富余\"的定位是石油安全的产业垫层，不是市场宽松。中西部炼厂\"立足本地需求\"、中小炼厂\"专精特新\"，说明下沉市场的油源仍以本地和中小炼厂为主。\n2. 规划在市场机制部分写入\"研究完善成品油消费税和定价机制\"。消费税是批发环节最大的税制变量，定价机制决定批发价与装车价的形成方式，两者并列为研究事项，说明改革已进入议程。方向未明，但任何调整都会改变加油业务的成本基础，是未来五年最需要盯住的一条。\n3. 上期碳达峰方案把石油消费达峰定为部署，本期油气规划把它落到炼能置换和税制研究两项安排上。油品需求的中长期见顶已写入规划，加油网络的价值将更多来自流量和服务，而不是油品增量。","focus":"1. 成品油消费税和定价机制的研究进展——征收环节、税率或定价周期的任何调整都直接改变批发价与折扣空间。 [B 研究/跟进]\n2. 炼油产能置换与炼厂整合的省级清单——会改变区域油源与装车价格局，尤其是下沉市场依赖的中小炼厂。 [C 跟踪]\n3. 绿色燃料相关文件——后续专项文件将定义替代节奏。 [C 跟踪]","advice":[{"business":"加油","tag":"","text":"按炼能收缩、消费达峰的情景校准中期油品需求与折扣空间判断；把成品油消费税与定价机制研究列为政策跟踪首位；下沉市场的供给方案继续以本地和中小炼厂为主，同时评估炼厂整合对区域装车价的影响。"}]},{"no":"04","policyId":"","title":"2026年上半年民生计量监管情况通报（2026-08-05发布）","info":"关键词：充电桩计量·加油机计量·强制检定·诚信计量单位\n\n发文机关：市场监管总局\n\n发布日期：2026-08-05　·　文号：无（新闻通报）　·　原标题：《市场监管总局抓实2026年上半年民生计量监管工作》\n\n通报称上半年\"聚焦电动汽车充电设施、眼镜制配计量器具、加油机、居民水电气表、电子计价秤等重点民生计量器具，强化计量监管\"。与公司业务相关的两组数据：\n\n- 充电桩：\"2026年1月至6月，全国监督检查充电桩运营单位11164家，抽查在用充电桩145829台，排查发现不合格充电桩1783台，依法查处各类计量违法问题282个\"\n- 加油机：\"2026年1月至6月，全国监督检查加油站43492家，核查在用加油机132906台，排查发现问题加油机6489台，培育规范诚信加油站计量单位30498家\"\n\n下一步将\"健全事前规范、事中监管、事后整改的闭环治理机制\"。","reading":"通报把充电桩计量与加油机计量并列为重点，两条业务线的商户合规都进入常态化执法阶段。\n\n1. 充电桩计量执法覆盖面已经很大，上半年抽查接近15万台。福州市市场监管局本月的强制检定告知书是各地执行口径的样本：面向社会经营的贸易结算用充电桩检定周期三年、免征费用，新装桩投运前须首检合格，经福建省强检计量器具智慧监管系统（企业端）备案报检。合规成本在流程和时限，不在费用。加上上期提示的充电桩强制性产品认证8月1日起实施，充电设备的准入认证与在用计量两道门槛都已到位。\n2. 加油机上半年核查超过13万台，发现问题加油机6489台。商户合规预警不能只看证照，计量检定状态要纳入。","focus":"1. 下半年计量监管通报——闭环治理机制下，问题商户的整改与处罚信息会更透明，可作为商户准入与预警的公开数据源。 [B 研究/跟进]\n2. 各省充电桩强检系统上线情况——决定场站合规的操作路径。 [C 跟踪]","advice":[{"business":"加油","tag":"","text":"把加油机计量检定状态纳入商户合规预警指标，核查合作油站的检定记录；诚信计量单位可作为优先合作对象。"},{"business":"充电","tag":"","text":"对照福州的三年周期、首检合格与备案报检要求，梳理各运营城市在营场站的检定台账，把检定到期提醒纳入商户治理标准。"}]}],"localRoundup":"本月地方文件集中在电力市场规则、成品油流通细则、绿电直连与充电合规四条线，另有园区配售电与接网容量一组常规动作。电力市场规则动作全部落在公司的目标省与已进入省。四川辅助服务分摊函与江苏分布式光伏方案对公司最有操作价值，单列说明，其余并入速览。\n\n1. 四川省进一步明确电力辅助服务市场费用分摊有关事宜的通知（川发改价格函〔2026〕332号，2026-07-31成文、08-17公开，四川省发展和改革委员会）\n\n关键词：辅助服务费用分摊·留川电量豁免·地县调机组暂不参与·8月底完成结算\n\n承接国家级：依据《关于建立健全电力辅助服务市场价格机制的通知》（发改价格〔2024〕196号）和《国家能源局综合司关于同意京津唐等14个地区电力辅助服务市场建设实施方案的复函》，结合《四川电力市场结算细则V1.0》作出。口径四条。一是未参与电能量市场交易的上网电量，非市场化机组按实际上网电量、市场化机组按优先计划电量确定分摊基数。二是接受省内市场价格但未直接参与电能量市场的上网电量，以及国调、西南网调机组留川电量，不纳入调频、备用辅助服务费用分摊，地县调机组暂不参与。三是已缴纳系统运行费的外送电量不重复收取。四是今年以来的费用原则上8月底前完成结算。\n\n对公司业务：四川是电力业务目标省，辅助服务费用与系统运行费同属现货结算中的非电能量成本，分摊范围每调一次，售电侧的成本口径就变一次。本次把留川电量、地县调机组排除在外，分摊集中在参与电能量市场的机组电量上，持仓测算应按新口径更新系统运行费假设。8月底完成年内结算，是核对四川结算数据的时点。[A 趁早行动]\n\n2. 江苏省分布式光伏发展实施方案（2026—2030年）（苏发改能源发〔2026〕695号，2026-07-21成文、07-29发布，江苏省发展改革委）\n\n关键词：1.2亿千瓦·园区集中汇流·虚拟电厂聚合平台·以荷定源·系统调节责任\n\n到2030年全省分布式光伏累计装机较2025年翻一番、达到1.2亿千瓦。与电力业务直接相关的三条：一是\"鼓励园区配套建设虚拟电厂聚合平台，统一参与省内需求响应、电力现货市场，提升项目收益\"；二是园区分布式光伏集中汇流、全额上网，\"以绿电直连、绿电直供形式，按照'以荷定源'原则为有刚性降碳、绿电物理溯源需求的用户提供绿电\"；三是\"自发自用余电上网的分布式光伏，其上网电量应公平承担相应的系统调节社会责任\"。方案还要求\"统筹光伏、储能、充电桩和各类用能设备，构建小型微电网\"。\n\n对公司业务：江苏是电力业务目标省，方案把分布式光伏、虚拟电厂聚合、现货参与写在同一条里，园区级聚合平台成为省级鼓励的组织形式。余电上网承担系统调节责任，说明分布式电源将进入市场化考核，代理这类电源入市的空间随之打开。充电桩被列入光储微电网的统筹对象，充电场站可作为负荷侧资源进入聚合方案。[B 研究/跟进]\n\n3. 其他地方政策合并速览\n\n电力市场规则方面，四川省能源局8月26日印发《四川电力市场2026年保底售电服务工作方案》（川能源〔2026〕47号，9月1日公开），依据《售电公司管理办法》（发改体改规〔2021〕1595号）和川发改能源〔2021〕549号，部署保底售电公司初选、市场运营监测与保底服务启动实施，方案全文以附件发布。保底售电是售电公司退出后承接其用户的兜底安排。四川的启动与国家层面电网售电公司\"只能从事保底售电和综合能源业务\"的口径互相印证，是目标省出清机制的直接信号。湖南省发展改革委7月30日印发湘发改价调〔2026〕460号，第四监管周期输配电价8月1日起执行，居民生活、农业生产用电继续执行现行目录电价，价格表以附件发布。湖南是已进入省，过网成本应按新价表重算。\n\n成品油流通方面，西藏自治区商务厅等9部门8月1日公布《西藏自治区成品油流通管理实施细则》，辽宁省商务厅8月10日就实施细则征求意见稿公开征求意见、截止9月10日，两件均依据国办发〔2025〕5号和商务部令2025年第4号。省级细则的通常内容可参照4月30日成文的湖北细则：批发、仓储经营向省商务厅备案，备案回执有效期3年；零售经营资格由市、县商务部门许可，批准证书有效期5年、一站一证。细则成片落地后，各省油站商户的证照与备案状态将成为平台准入的硬门槛。\n\n绿电直连方面，辽宁省发展改革委8月4日就《辽宁省推动多用户绿电直连建设实施方案（征求意见稿）》公开征求意见，公示至8月12日，方案依据发改能源〔2026〕688号起草。山东省政府新闻办8月18日发布会通报，全省已批复实施7个绿电直连项目。7月印发的《关于加强和规范绿电直连发展的通知》提出11项措施，支持年综合能耗1万吨标准煤以上的重点用能企业开展多用户绿电直连。通报同时明确，直连项目\"仍需按相关规定缴纳输配电费、系统运行费、政府性基金及附加等费用，整体参与电力市场\"，评估园区侧售电机会时应按这一口径测算。\n\n充电合规与补贴方面，福州告知书前节已述。海口市发展改革委8月7日启动2025年度充换电基础设施联合验收与建设运营补贴申报，场站须完成备案并接入海南省充换电一张网服务平台，8月20日前提交申请表、8月25日前完成现场检查、8月28日前提交验收报告。接入省级平台是申报的前置动作。\n\n园区与接网容量方面，上期跟踪的内蒙古和林格尔绿电园区，呼和浩特市发展改革委8月7日公示优选结果，拟确定内蒙古能源集团有限公司为牵头企业，园区级增量配电网加新能源、储能、售电的一体化样本进入实施阶段。上海市发展改革委公布2026年度陆上风电34.531万千瓦、光伏电站145.385万千瓦开发建设方案（沪发改能源〔2026〕137号），支持纳入方案的项目与用户开展绿电直连试点。黑龙江、郑州分别公告第三季度分布式光伏可开放容量与承载力评估结果。此外，重庆市北碚区据公告征选2026年\"渝悦消费\"成品油消费券发放平台企业，报名8月27日至9月2日，这是地方政府把成品油消费券交给平台发放的一个样本。","appendix":"以下动向的正式文本尚待取得或发布时间贴近本期边界，据公开信息提示提前关注：\n\n（涉及内部信息，个人版已隐去）。挂网后将是电力业务年内最重要的规则文件，下期重点详析。\n2. 山东省完善工商业非电网直供环节电价政策——据大众日报8月30日报道，省发展改革委、省市场监管局联合印发通知，2026年10月1日起执行，2026年最高预购电价每千瓦时0.83元（含12%损耗），损耗率上限12%。商业综合体、园区内的公共充电场站多为转供电用户，取得正文后应专项评估对场站电费与服务费定价的影响。\n3. 商务部等9部门《关于进一步激发下沉市场活力 活跃县域消费的意见》（商流通函〔2026〕371号，8月18日公开）——据公开信息提出支持新能源汽车下乡、扩大农村充电设施覆盖，触及加油业务的下沉市场展业和充电线的县域场景（业务口径中为材料空白，需业务方裁定）。\n4. 商务部等7部门《关于推动商品消费扩容升级的实施意见》（8月31日公开解读）——据公开信息含优化汽车限购、完善公路沿线与交通枢纽新能源车补能设施、促进公共充电桩覆盖均衡等内容，原文待取得。\n5. 国家发展改革委两份征求意见稿——《能源保供中长期合同管理办法（试行）》（8月14日截止），规范电煤、电力、天然气保供中长期合同，与电力业务的火电长协直接相关；《电网公平开放监管办法》（8月30日截止），涉及分布式电源与绿电直连的接网公平。\n6. 电池消费税征收管理——税务总局公告2026年第16号及财政部、海关总署、税务总局公告2026年第20号自9月1日起施行，涉及储能与动力电池成本。\n7. 税务总局《关于成品油零售\"交易即开票\"有关事项的公告》（2026年第11号，6月发布）——据公开信息，11月1日前全面实现成品油零售交易即开票，互联网平台应作为直连单位接入并报送涉税信息，对加油平台是直接义务。\n8. 行政分时电价取消的省份分布——据公开报道，目标省份中湖北、陕西、重庆、四川、云南、贵州已取消，江苏在征求意见，浙江、福建、湖南与南方区域其余省份未见取消文件。（涉及内部信息，个人版已隐去）。\n9. 其他动向——国家能源局综合司《供电企业信息公开实施办法（修订稿）》征求意见（9月30日截止），涉及报装、电价、停电信息公开。国家能源局8月24日发布的7月充电设施数据显示私人桩增速显著高于公共桩，与本期关于居住区充电供给被推高的判断一致。国家能源局8月5日发布《中国绿色燃料发展报告（2026）》。据公开信息，江苏、福建、海南等省第四监管周期输配电价亦于8月1日执行。常州市《\"十五五\"新能源产业发展规划》（常政办发〔2026〕18号）正文待取得。四部门7月8日加油机作弊常态化监管指导意见、湖南7月17日电力市场规则修订版贴近上期边界，建议一并取得后补评。","uncovered":"","caveats":[]}},"2026-09":{"id":"2026-09","type":"MONTHLY","title":"能源政策月刊 · 2026 年 9 月","year":2026,"month":9,"coverDate":"2026-09-01","publishDate":"2026-10-08","status":"PUBLISHED","version":1,"content":{"schema":"monthly.v2","month":"2026-09","narrative":"","overview":"9月，电力零售规则进入征求意见阶段。国家发展改革委9月4日公开征求《售电公司管理办法（公开征求意见稿）》意见，10月4日截止。这是对发改体改规〔2021〕1595号的修订，拟2027年1月1日起施行。（涉及内部信息，个人版已隐去）。\n\n9月30日，国家发展改革委再就《电力市场风险防控管理办法（公开征求意见稿）》征求意见，10月30日截止。同日国家能源局就《电力并网运行管理规定（征求意见稿）》征求意见。加上9月4日刊出的修订后《电力安全事故应急处置和调查处理条例》（国令第845号，2027年1月1日施行），电力市场的风险处置程序、并网义务和事故责任在同一个月配齐。并网规定草案把电动汽车充电网络、新型储能、绿电直连列为并网主体或参照执行对象。\n\n产业侧，工业和信息化部等九部门9月11日发布《智能网联新能源汽车产业发展\"十五五\"规划》，到2030年新能源乘用车新车销量占比达到70%，并部署大功率充电设施布局和车网互动规模化应用。省级层面，陕西9月25日、福建9月30日电力现货市场转入正式运行，一个是公司电力业务已进入省，一个是目标省。湖南把绿电直连拓展到多用户，江苏明确第四监管周期输配电价执行的三项江苏口径，山东工商业非电网直供环节电价10月1日起执行。\n\n截至发稿，加油线9月没有专门针对成品油流通的国家级文件。国家发展改革委9月10日发布解读稿称，已与市场监管总局联合印发重要工业品低价无序竞争成本核算通知，聚焦工业品生产领域，未涉及零售。地方层面，湖南公示21个县域充电设施补短板县（市）名单。","businessTakes":[{"business":"加油","text":"规划把新能源乘用车70%写进2030年目标，下沉市场燃油车存量判断要再压一档。截至发稿，9月未见改变批发价、装车价的国家级文件，税务处罚裁量基准等动向见附录。"},{"business":"充电","text":"售电办法草案把充电桩（含车网互动）和资源聚合列为电网企业所属售电公司可做业务的例外，场站侧可能多一类有电网背景的竞争者。并网规定草案把能响应调度指令的充电网络列为负荷侧并网主体，场站聚合参与调度从鼓励变成义务框架。规划明确大功率充电与车网互动规模化应用，场站升级有了五年依据。"},{"business":"电力","text":"售电办法草案把注册门槛、履约保障、集中度上限、保底售电写成可执行条款，2027年起施行，合规能力建设要在年内完成。陕西、福建现货转正式，已进入省与目标省的结算规则进入稳定期。风险防控办法与并网规定两份草案都在10月30日前仍可提意见，是本月还能影响正式稿的两件国家级件。"}],"quickTable":[{"no":"01","level":"国家级","score":"5分","title":"售电公司管理办法（公开征求意见稿）","issuer":"国家发展改革委","date":"09-04发布","doc_no":""},{"no":"02","level":"国家级","score":"4分","title":"电力市场风险防控管理办法（公开征求意见稿）","issuer":"国家发展改革委","date":"09-30发布","doc_no":""},{"no":"03","level":"国家级","score":"4分","title":"智能网联新能源汽车产业发展\"十五五\"规划","issuer":"工业和信息化部等九部门","date":"09-11发布","doc_no":"工信部联规函〔2026〕305号"},{"no":"04","level":"国家级","score":"3分","title":"电力安全事故应急处置和调查处理条例（国令第845号）·电力并网运行管理规定（征求意见稿）","issuer":"国务院·国家能源局综合司","date":"09-04 / 09-30发布","doc_no":""},{"no":"05","level":"地方","score":"","title":"关于陕西电力现货市场转正式运行的通知","issuer":"陕西省","date":"09-24","doc_no":"陕发改运行〔2026〕1329号"},{"no":"06","level":"地方","score":"","title":"关于福建电力现货市场转正式运行的通知","issuer":"福建省","date":"09-22","doc_no":"闽发改电力〔2026〕406号"},{"no":"07","level":"地方","score":"","title":"关于推动多用户绿电直连发展有关事项的通知","issuer":"湖南省","date":"09-18","doc_no":"湘发改能源〔2026〕541号"},{"no":"08","level":"地方","score":"","title":"转发第四监管周期省级电网输配电价通知","issuer":"江苏省","date":"08-24","doc_no":"苏发改价格发〔2026〕777号"},{"no":"09","level":"地方","score":"","title":"关于完善工商业非电网直供环节电价政策的通知","issuer":"山东省","date":"09-02","doc_no":"鲁发改价格〔2026〕614号"},{"no":"10","level":"地方","score":"","title":"2027年新能源增量项目机制电价竞价通知","issuer":"辽宁·北京","date":"09-21 / 09-24","doc_no":"辽发改价格〔2026〕521号、京发改〔2026〕1598号"},{"no":"11","level":"地方","score":"","title":"虚拟电厂管理办法（试行）、接入技术管理规范、建设服务指南（暂行）","issuer":"辽宁省","date":"09-09 / 09-24","doc_no":""},{"no":"12","level":"地方","score":"","title":"拟纳入2026年县域充电设施补短板县（市）名单公示","issuer":"湖南省","date":"09-16","doc_no":""}],"details":[{"no":"01","policyId":"","title":"售电公司管理办法（公开征求意见稿）（2026-09-04发布）","info":"关键词：注册门槛·一地注册全国共享·分时电价零售合同·实名认证·业务地比例上限·电网售电公司业务范围·履约保障200万元·保底售电·2027年1月1日施行\n\n发文机关：国家发展改革委（公告）\n\n发布日期：2026-09-04　·　意见征求期：2026-09-04至2026-10-04　·　文号：无（修订发改体改规〔2021〕1595号）\n\n公告称对2021年办法作了修订，目的是\"加快推进全国统一电力市场建设，规范售电公司经营行为\"。草案七章48条，由国家发展改革委、国家能源局、市场监管总局负责解释，第四十八条规定\"本办法自2027年1月1日起施行，有效期5年\"。与公司业务直接相关的条款（摘录）：\n\n- 注册条件（第五条）：\"注册资本不低于2千万元人民币\"；\"售电公司应拥有10名及以上具有劳动关系的全职专业人员。专业人员应有电力、能源、经济、金融等行业3年及以上工作经验。其中，至少拥有1名高级职称和3名中级职称的专业管理人员……\"。另须有首注地固定经营场所、技术支持系统和法定代表人与主要股东的信用承诺。\n- 零售合同与集中度（第十九、二十三、二十五条）：\"售电公司与用户等经营主体应在电力交易平台签订分时电价零售合同……用户须实名认证，并在市场注册注销、合同签订变更等关键环节线上确认\"；\"同一实际控制人注册的售电公司在同一业务地的售电量合计，不得超过该业务地规定的电力零售市场交易总量比例上限\"；发电集团所属售电公司与本集团发电企业的指向性交易电量\"不得超过该业务地规定的发电集团交易总量比例上限\"。\n- 电网售电公司（第二十四条）：\"电网企业所属售电公司不参与保底售电、综合能源服务、充电桩（含车网互动）、资源聚合以外的竞争性售电业务，按照《电网企业电力业务范围清单》要求开展业务。\"\n- 履约保障（第二十八、三十、三十一条）：可用履约保函、保险或现金保证金；\"售电公司履约保障额度根据在业务地的预计年售电量×1分/千瓦时×调整系数确定，最低不少于200万元，调整系数在1—10区间设置\"；交易机构按日监测，\"保障额度不足的，由电力交易机构在1个工作日内通知售电公司补缴，并暂停其本省份交易。售电公司应在3个工作日内完成补缴\"。\n- 保底售电与信用（第三十八、四十二条）：\"原代理售电公司无法继续履约的用户进入保底售电当月执行现货实时市场价格\"；\"售电公司信用评价结果应与履约保障形式和额度、注册条件核验方式和频次等挂钩。信用评价等级较低的售电公司，不得以履约保险形式提交保障凭证。\"","reading":"这是上期首要观察点的兑现。（涉及内部信息，个人版已隐去）。\n\n（涉及内部信息，个人版已隐去）。据公开解读，专业人员与职称要求沿自2021年版办法，征求稿把资产总额分档改为注册资本门槛。（涉及内部信息，个人版已隐去）。\n2. 比例上限下放到业务地。（涉及内部信息，个人版已隐去）。草案另设同一实际控制人在同一业务地的零售交易总量比例上限，具体数字由省级确定。对公司来说，各目标省的比例上限成了选省变量，省间很可能不一致。\n（涉及内部信息，个人版已隐去）。充电场景可能直接面对电网背景的售电公司，公司充电负荷加售电的组合方案要把这一类对手算进去。\n4. 履约保障与保底售电把违约成本写实。额度按预计年售电量乘1分再乘系数，最低200万元，按日盯市。额度不足即被通知补缴并暂停本省交易，3个工作日内须补足，暂停超过3个工作日仍未补缴的自动减少业务地。用户进入保底当月按现货实时价结算，违约后果由用户和售电公司共同承担。","focus":"1. 正式稿与各业务地的比例上限——意见征求10月4日已截止，正式稿出台后各省要定零售交易总量和发电集团交易的比例上限，这是目标省展业的第一个变量。 [A 趁早行动]\n2. 《电网企业电力业务范围清单》——草案第二十四条据此划定电网售电公司的业务边界，充电桩（含车网互动）是否实际开放看清单内容。 [B 研究/跟进]\n3. 履约保障调整系数与信用评价规则——系数由省级确定，信用等级决定能否用保险替代保函，两者合起来决定资金占用。 [B 研究/跟进]","advice":[{"business":"电力","tag":"","text":"对照第五条逐项核注册资本、专业人员与职称、技术支持系统、经营场所，2027年1月1日前补齐；按最低200万元和1分/千瓦时乘系数测算各业务地的履约保障资金占用；意见征求已截止，正式稿出台前通过行业渠道反映比例上限的省间一致性与系数区间问题。"},{"business":"充电","tag":"","text":"把电网企业所属售电公司列为充电场景的潜在竞争对手，评估其进入公共场站售电与车网互动的路径；场站作为零售用户须实名认证和线上签约，流程改造与电力业务同步推进；正式稿出台前通过行业渠道反映电网售电公司经营充电桩（含车网互动）的业务边界问题。"}]},{"no":"02","policyId":"","title":"电力市场风险防控管理办法（公开征求意见稿）（2026-09-30发布）","info":"关键词：风险分类·合同违约风险·价格异常风险·分级管理·市场暂停与恢复·操作风险内控·10月30日截止\n\n发文机关：国家发展改革委（公告）\n\n发布日期：2026-09-30　·　意见征求期：2026-09-30至2026-10-30　·　文号：无\n\n草案依据国办发〔2026〕4号、《电力市场监管办法》（18号令）、《电力市场运行基本规则》（20号令）制定，七章32条，\"适用于全国范围内电能量、电力辅助服务等市场的风险防控\"，施行日期在草案中留空。与公司业务直接相关的条款（摘录）：\n\n- 风险分类（第十一条）：\"合同违约风险，是指经营主体主观不愿意继续履约或客观上失去履约能力，导致大面积无法履行已签订的中长期合约、零售合同或执行现货及辅助服务市场交易结果的风险\"；\"其他市场运行风险，是指经营主体交易申报差错、滥用高频量化交易、提供虚假注册资料获取交易资格等，影响市场正常秩序的风险\"。\n- 经营主体责任（第九条）：\"应充分了解市场交易规则和交易平台操作，建立防止交易申报差错等操作风险的内部管控流程，并对因操作差错引发的风险承担相应后果。\"\n- 合同违约风险防控（第二十条）：事前预控\"加强并网运行管理；强化履约保障与可交易限额等挂钩\"；事中、事后处置\"按照市场规则开展管理和结算；按相关规定启动保底售电程序\"。\n- 价格异常风险防控（第二十一条）：事前预控\"按照国家相关规定和程序合理制定电力市场申报、出清价格上下限及相关价格风险防范措施\"。\n- 分级管理（第十四、十六条）：\"电力市场重大风险是指可能引发电力市场暂停或中止、终端用户电价大幅波动、经营主体大面积或大额亏损等风险\"；\"重大风险可由国家发展改革委、国家能源局视情况提级管理\"。","reading":"1. 这是省级现货规则之上的处置总程序。市场暂停、中止与恢复由谁批、临时措施怎么审定，草案第十六条和第二十七条写了路径，紧急风险可先处置后报告。极端行情下已签合同和交易结果怎么调整、费用怎么分摊，将由各地的风险防范与处置预案按第十八条写实。\n2. 合同违约风险的处置与售电办法草案衔接。履约保障与可交易限额挂钩、启动保底售电，两份草案同月出，口径一致。售电公司的违约在这里被当作市场风险事件处理，不只是民事纠纷。\n3. 价格上下限被定位为价格异常风险的事前预控。（涉及内部信息，个人版已隐去）。下限放开后用什么替代，要看正式稿和各省预案。\n4. 交易申报差错和滥用高频量化交易被点名。交易团队的算法交易要有内控流程，差错后果自担，策略设计要避开可能被认定为滥用的情形。","focus":"1. 10月30日截止的意见征求——临时措施审定时限、保底售电触发口径、高频量化交易的界定，都值得提。 [A 趁早行动]\n2. 各省风险防范与处置预案——草案第七条、第十七条要求市场运营机构编制、省级审定，陕西、福建转正式后将据此修订。 [B 研究/跟进]\n3. 施行日期与正式稿——草案留空，正式稿一出即生效的可能性要考虑。 [C 跟踪]","advice":[{"business":"电力","tag":"","text":"10月30日前提交意见；把交易申报差错的内控流程写进交易团队制度；按草案对高频量化交易的表述自查算法策略；对已进入省与目标省的处置预案保持跟踪，预案一出就更新持仓的风险假设。"}]},{"no":"03","policyId":"","title":"智能网联新能源汽车产业发展\"十五五\"规划（2026-09-11发布）","info":"关键词：新能源乘用车70%·大功率充电·农村充电短板·车网互动规模化·反不正当竞争和价格执法·以旧换新与新能源汽车下乡\n\n发文机关：工业和信息化部、国家发展改革委、公安部、交通运输部、商务部、自然资源部、住房和城乡建设部、市场监管总局、国家网信办\n\n成文日期：2026-09-09　·　发布日期：2026-09-11　·　文号：工信部联规函〔2026〕305号\n\n通知印发至各省级九个主管部门，规划全文以附件发布。与公司业务直接相关的表述（摘录）：\n\n- 目标：\"到2030年……国内市场新能源乘用车、商用车在各自领域新车总销量的占比分别达到70%、40%\"；\"乘用车平均燃料消耗量达到每百公里3.3升、纯电动乘用车平均电能消耗量达到每百公里11.5千瓦时左右\"。\n- 重点任务10\"强化汽车与能源融合发展\"：\"加快完善充换电基础设施，科学合理布局大功率充电设施，补强农村充电设施建设短板，持续提升充换电服务效能。加快推进车网互动规模化应用，探索可持续商业模式。推动新能源汽车与绿色电力、绿色氢能协同发展，加强新能源重卡在干线物流、特定场所短途运输等场景的推广应用。\"\n- 重点任务14\"维护健康有序市场环境\"：\"加强市场监管执法，强化反垄断、反不正当竞争和价格执法司法……规范地方通过违规提供财政补贴、税费优惠、土地优惠以及过度配置资源等进行不当招商引资行为。\"\n- 专栏5标准体系：\"不断完善电动汽车碰撞后安全、动力电池安全、驱动电机系统安全、充换电安全等电安全标准\"；加快制定\"车网互动、汽车芯片等交叉领域相关标准\"。\n- 组织实施：\"落实好新能源汽车税收优惠政策，深入推进汽车流通消费改革试点，加快破除汽车流通消费限制性措施……支持开展汽车'以旧换新'、新能源汽车下乡、城市公交车及动力电池更新等活动。\"","reading":"这是充电业务战略重心的产业侧五年基准，与8月的电力、油气两份专项规划同一层级。\n\n1. 乘用车70%改写充电线的核心假设。私家车份额越来越高是充电业务的前提，规划把它变成了国家目标，兑现速度比内部假设快。对加油业务，头部城市油转电明显、下沉城市以油车为主的判断，中期要按新能源占比过半的情景再压一档。\n2. 任务10里与场站升级直接相关的是大功率充电布局。它与公司的大功率升级方向一致，升级节奏可以按规划窗口排。农村充电短板、车网互动规模化、新能源重卡三项落在现有业务材料未见安排的维度，是否跟进需业务方裁定。车网互动还要和售电办法草案第二十四条合起来看，电网售电公司已被允许经营这一业务。\n3. 价格执法与不当招商被写进汽车产业规划，充电场站的地方补贴与服务费竞争将在更严的框架下进行。","focus":"1. 大功率充电设施布局的省级落实——各省\"十五五\"充电规划将据此分解，场站升级的补贴与标准随之而来。 [B 研究/跟进]\n2. 车网互动规模化应用的商业模式试点——规划要求探索可持续商业模式，试点省份与价格机制待业务方裁定后再定跟进深度。 [C 跟踪]\n3. 新能源汽车税收优惠与以旧换新、下乡政策的延续安排——决定2027年后的购车需求曲线。 [C 跟踪]","advice":[{"business":"充电","tag":"","text":"以2030年乘用车70%校准私家车需求曲线与城市级建桩节奏；按规划的大功率充电布局窗口排定存量场站升级；农村、车网互动、重卡三项提请业务方裁定。"},{"business":"加油","tag":"","text":"新能源汽车下乡写入规划组织实施，县域油车替代的节奏要重新估。"}]},{"no":"04","policyId":"","title":"电力安全事故应急处置和调查处理条例与电力并网运行管理规定（征求意见稿）（2026-09-04 / 09-30发布）","info":"关键词：其他并网主体·统一调度·自备应急电源·事故罚款·充电网络·新型储能·并网调度协议\n\n条例——发文机关：国务院　·　文号：国令第845号\n\n公布日期：2026-08-30　·　刊出日期：2026-09-04　·　施行日期：2027-01-01\n\n条例2011年以国务院令第599号公布，本次经2026年8月21日国务院第94次常务会议修订通过，共38条。新华社通稿概括的修订内容之一是\"将电力企业、电力用户以外并入电网运行的主体纳入本条例适用范围，明确其相应的电力安全责任\"。与公司业务相关的条款（摘录）：\n\n- 第五条：\"电力企业、电力用户以及其他并入电网运行的主体（以下简称其他并网主体），应当遵守电力安全管理规定，服从统一调度，严格执行有关标准和技术规范\"；\"县级以上地方人民政府有关部门确定的重要电力用户，应当按照国务院能源主管部门的规定配置自备应急电源\"。\n- 第十四条：电力调度机构可以发布调整发电设备出力、调整电网运行方式等调度命令，\"电力企业、电力用户以及其他并网主体应当执行\"；事故可能导致大面积停电的，调度机构\"有权决定采取拉限负荷、解列电网、解列发电设备等必要措施\"。\n- 第二十九条：事故责任单位按事故等级处30万元以上100万元以下至1000万元以上2000万元以下的罚款，情节特别严重的可按2倍以上5倍以下处罚。\n\n并网规定征求意见稿——发文机关：国家能源局综合司　·　文号：无（修订国能发监管规〔2021〕60号）\n\n发布日期：2026-09-30　·　反馈期限：发布之日起30日内　·　共36条。摘录：\n\n- 第二条：规定适用于省级及以上调度机构直接调度的发电侧并网主体\"以及能够响应电力调度指令的新型储能。传统高载能工业负荷、工商业可中断负荷、电动汽车充电网络等能够响应电力调度指令的可调节负荷等负荷侧并网主体……以及能够响应电力调度指令的绿电直连、源网荷储一体化等新型经营主体，视其对电力系统运行的影响参照本规定执行\"。\n- 第七条：\"参照国家有关部门制订的《并网调度协议》示范文本及时签订并网调度协议，无协议不得并网运行。\"","reading":"两件合起来看，是并网主体责任框架的一头一尾：条例定事故责任，规定草案定日常义务。\n\n1. 责任主体从电力企业扩到并网主体。条例用\"其他并网主体\"概括，本刊的推论是电力业务项下的储能项目、聚合入市的分布式电源与负荷都在其中。规定草案第二条则把电动汽车充电网络、新型储能、绿电直连写成明文，充电场站只要能响应调度指令，就参照执行。\n2. 义务是可核查的。并网调度协议无协议不得并网，涉网参数未经调度机构许可不得改变，调度指令要迅速准确执行，规定第二十二条把考核落到电费调整上。负荷侧参照执行的边界草案未明写，本刊理解将落在各区域实施细则，这是征求期内最值得提的意见。\n3. 罚款档位把事故成本量化。一般事故起罚30万元，主要负责人按年收入比例罚款，2027年起适用。储能项目和聚合负荷按规定草案第九条要编制事故处理预案并参加反事故演练，条例第十二条的应急救援预案义务目前只写电力企业。","focus":"1. 并网规定正式稿与各区域实施细则——草案第二十条由国家能源局各区域监管局商省级部门修订细则，负荷侧参照执行的具体标准在细则里。 [B 研究/跟进]\n2. 条例事故等级划分附表与单一变电站供电区域的划分标准——后者由国务院能源主管部门另行制定。 [C 跟踪]\n3. 重要电力用户名单——由县级以上地方政府有关部门确定，决定自备应急电源义务落到哪些场站。 [C 跟踪]","advice":[{"business":"电力","tag":"","text":"储能项目与聚合负荷逐项核并网调度协议、涉网参数备案和应急预案，2027年1月1日前对齐条例；10月30日前就负荷侧参照执行的边界提交意见。"},{"business":"充电","tag":"","text":"梳理场站是否被列入重要电力用户或已接入负荷管理系统，自备应急电源与响应义务按条例和规定草案预留。"}]}],"localRoundup":"本月地方文件集中在现货转正式、绿电直连、结算口径、机制电价竞价、虚拟电厂和充电配套六条线，另有加油线两件小件。陕西、福建转正式和湖南多用户绿电直连对公司最有操作价值，单列说明，其余并入速览。\n\n1. 陕西、福建电力现货市场转正式运行（陕发改运行〔2026〕1329号，2026-09-24发布，陕西省发展和改革委员会、国家能源局西北监管局；闽发改电力〔2026〕406号，2026-09-21成文、09-22发布，福建省发展和改革委员会、国家能源局福建监管办公室）\n\n关键词：转正式·连续结算试运行·第三方评估·报国家备案\n\n承接国家级：两省都按《国家发展改革委办公厅 国家能源局综合司关于全面加快电力现货市场建设工作的通知》（发改办体改〔2025〕394号）要求，经省政府同意并报国家发展改革委、国家能源局备案。陕西2025年1月启动连续结算试运行，\"已连续运行一年八个月\"，自2026年9月25日起转入正式运行。福建2025年3月1日启动连续的全月结算试运行，2025年9月开展连续结算试运行，\"已连续运行超过18个月\"。省里委托国家电规总院开展第三方评估，评估意见认为\"市场规则体系健全，合规管理、市场风险防控、信息披露、信用管理等制度完善……满足转正式运行条件\"。福建自2026年9月30日起转入正式运行。\n\n对公司业务：陕西是电力业务已进入省，转正式后交易与结算从试运行口径切换为正式口径，持仓和结算测算要按正式规则重跑。福建是目标省，评估意见逐项确认的规则体系与合规、风控、披露、信用等制度，正是选省判断要核的内容，福建的进省前置条件已由官方确认。两省的风险防范与处置预案将按风险防控办法草案修订。据公开信息，截至10月8日，四川、重庆、湖南仍为连续结算试运行。[A 趁早行动]\n\n2. 湖南省关于推动多用户绿电直连发展有关事项的通知（湘发改能源〔2026〕541号，2026-09-18发布，湖南省发展和改革委员会）\n\n关键词：多用户直连·园区·以荷定源·法人主责单位·整体参与现货·不得由电网代购电\n\n承接国家级：依据发改能源〔2026〕688号和发改价格〔2025〕1192号，在湘发改能源〔2025〕853号实施方案基础上制定。多用户指多个不同法人实体，不包括居民和农业用户，\"工业园区、零碳园区、增量配电网等的全部或部分负荷可就近接入新能源，组成多用户绿电直连项目\"。\"项目年自发自用电量占总可用发电量的比例不低于60%，占总用电量的比例不低于30%、2030年前不低于35%\"。\"园区模式的项目主责单位可由园区管委会或第三方机构（不含运营输电业务的公共电网企业）投资组建\"。并网型项目原则上作为整体参与电力市场，\"现阶段项目可以'报量不报价'方式参与电力现货市场\"，\"项目不得由电网企业代理购电\"。\n\n对公司业务：湖南是已进入省，文件把园区型直连的主责单位向第三方机构开放，公司以第三方身份进入园区直连项目有了制度口径。项目整体参与现货、不得由电网代购电，但文件没有给售电公司写入角色，本刊的推论是园区型直连项目会分走部分可代理电量，进场前要先算分流。充电场站若坐落在适用的园区内，可作为园区负荷参与直连，需逐一核场站所在园区是否适用。[B 研究/跟进]\n\n3. 其他地方政策合并速览\n\n结算口径方面，江苏省发展改革委8月6日印发苏发改价格发〔2026〕777号（8月24日公开），转发国家第四监管周期输配电价通知并明确三项江苏口径。输配电价外单列的天然气发电容量电费分摊标准含税每千瓦时0.023元，执行至2026年12月31日，2027年1月1日起每月据实向全体工商业用户分摊。省内四座和省间两座抽水蓄能电站的容量电费每月据实向全体工商业用户分摊。抽水蓄能抽发收益20%由电站分享、80%由全体工商业用户分享，用于冲减系统运行费。江苏是目标省，本刊的判断是三项都是现货结算里系统运行费科目的输入，价表以附件发布。宁夏7月31日发文落实输配电价，8月1日起执行。四川上月启动的保底售电服务与售电办法草案的保底售电章节衔接。\n\n转供电方面，山东省发展改革委、省市场监管局8月18日印发鲁发改价格〔2026〕614号（9月2日公开），10月1日起执行，上期附录已据报道提示。后付费到户电价按直供主体当月结算平均电价除以（1减损耗率）计算，损耗率最高不得超过12%。与充电直接相关的是\"非电网供电环境下建设的充换电设施，电价政策按国家相关规定执行，本通知规定的损耗应列入充换电服务费，不得随电费向终端用户收取\"，山东商业综合体内的公共场站10月电费起按此核对。\n\n机制电价竞价方面，辽宁省发展改革委9月18日印发辽发改价格〔2026〕521号（9月21日公开），2027年竞价纳入机制的电量总规模53.08亿千瓦时，竞价上限每千瓦时0.3元、下限0.18元，执行期限12年。北京市发展改革委9月22日印发京发改〔2026〕1598号（9月24日公开），规模8.5亿千瓦时，竞价上限每千瓦时0.3598元，执行期限12年，分布式项目可聚合参与。辽宁、北京不是目标省，两件给代理新能源入市一个2027年的参数样本。\n\n虚拟电厂方面，辽宁省发展改革委、省工业和信息化厅8月28日印发《辽宁省虚拟电厂管理办法（试行）》（辽发改能源规〔2026〕3号）。9月4日、9月24日又印发接入技术管理规范和建设服务指南（暂行），全文均以附件发布。辽宁不是目标省，三件只作电力业务项下虚拟电厂抓手的省级样本。\n\n充电配套方面，湖南省发展改革委、省财政厅9月16日公示拟纳入2026年县域充电设施补短板的21个县（市），由48个申报方案竞争性评审产生，公示至9月18日。依据是湘工信装备〔2026〕211号和省发改委、财政厅的申报通知。县域场景在现有业务材料中未见安排，是否跟进需业务方裁定。\n\n加油线方面，重庆市北碚区9月3日再次公开征选2026年成品油消费券发放平台企业，首轮\"在规定时间内未收到符合要求数量的企业报名材料\"，报名9月3日至9日，评审标准与上期一致。湖南省政府办公厅8月13日印发《湖南省促进天然气消费利用的若干措施》（湘政办发〔2026〕41号，9月1日公开），部署沿高速公路和省界节点完善车用LNG加注网络。涉及的车型维度在现有业务材料中未见安排，需业务方裁定。","appendix":"以下动向的正式文本尚待取得或发布时间贴近本期边界，据公开信息提示提前关注：\n\n1. 省级现货与市场规则动态——据公开信息，安徽现货市场9月9日转正式运行。浙江9月23日发布新型主体市场化响应实施细则2.0版和虚拟电厂运营管理实施细则。湖南电力交易中心9月21日公布售电公司信用评价结果。海南9月14日重申2026年市场化交易价格上限0.51576元、下限0.34384元每千瓦时，9月21日发布虚拟电厂建设运行管理办法；广东9月16日通知9家售电公司退出市场。原文待取得后补评。\n2. 国家能源局公告2026年第3号（9月14日公布）——据公开信息废止15件规范性文件，含2013年电力用户与发电企业直接交易、2018年发电权交易、2014年跨省区辅助服务补偿等文件。废止理由是与全国统一电力市场体系要求不相适应。国家发展改革委令2026年第45号10月1日起施行，据公开信息废止的67件中含跨地区电能交易、电力需求侧管理等电力旧件。\n3. 工业和信息化部等七部门《新型电池产业发展\"十五五\"规划》（工信部联规〔2026〕220号，9月28日发布）——据公开信息部署长时储能电池研发，拓展电源侧、电网侧、园区、数据中心储能场景。这是电力业务项下储能项目的产业侧背景。\n4. 税务三项——据报道，税务总局《全国税务行政处罚裁量基准（2026年版）》（公告2026年第20号）11月1日施行，统一原六大区域基准并附轻微不罚清单，原文待取得。电池消费税两份公告9月1日起施行，9月无新口径。成品油零售\"交易即开票\"11月1日前全面实现，9月无新通知。\n5. 消费与下沉——商务部等7部门《关于推动商品消费扩容升级的实施意见》（商消费函〔2026〕389号，8月31日公开）含优化汽车限购、完善公路沿线补能设施。商流通函〔2026〕371号下沉市场县域消费意见9月无国家级配套细则。国办函〔2026〕82号房车消费措施涉及高速公路服务区充电，高速场景在现有业务材料中未见安排，需业务方裁定。\n6. 待正式稿的三件——《电网公平开放监管办法》9月4日通告收到意见21条，《能源保供中长期合同管理办法（试行）》8月25日通告，两件9月均无正式稿。《供电企业信息公开实施办法（修订稿）》9月30日截止，未见正式稿。据公开信息，现行《电网公平开放监管办法》9月28日有效期已满。2021年版《售电公司管理办法》有效期约在11月上旬届满，新办法拟2027年1月1日施行。《电力现货市场基本规则（试行）》有效期至10月15日，截至发稿均未见延期或新版。发改价格〔2024〕196号辅助服务价格机制通知原文仍待取得。\n7. 分时电价——据公开信息，9月没有新的省份发布取消行政分时电价文件。山东10月1日起调整分时电价峰谷时段，适用代理购电用户。据报道，陕西电力交易中心2025年12月提示自2026年起市场化用户分时价格不再执行峰谷浮动，系交易中心提示而非发展改革部门文件，转正式通知未涉及。\n8. 其他动向——市场监管总局9月20日表态加快价格法修订，构建低价倾销规制体系。国家能源局9月22日下达2026年能源领域行业标准制修订计划，制定849项、修订450项，是否含充电与车网互动标准待核。国家能源局9月23日发布8月充电设施存量2422.3万枪，同比增长39.6%，据公开信息1至8月公共桩增量同比下降39.9%。国家电网9月16日发布举措推动新建小区固定车位100%配建私桩或预留条件，居住区场景在现有业务材料中未见安排，需业务方裁定。常州市\"十五五\"新能源产业发展规划正文仍未公开，湖南湘工信装备〔2026〕211号产业政策措施正文待取得。","uncovered":"","caveats":[]}},"2026-10":{"id":"2026-10","type":"MONTHLY","title":"能源政策月刊 · 2026 年 10 月","year":2026,"month":10,"coverDate":"2026-10-01","publishDate":"2026-11-11","status":"PUBLISHED","version":1,"content":{"schema":"monthly.v2","month":"2026-10","narrative":"","overview":"10月，电力市场的国家基础规则集中更新。国家发展改革委10月19日就《电力现货市场基本规则（公开征求意见稿）》公开征求意见，11月18日截止，这是对2023年试行版的修订，拟2027年1月1日起施行。新规则把全国统一、发用两侧全面报量报价、节点电价、差价结算写进同一个文本，现货市场的基本规则改由国家统一制定，各省细则在这个框架内定参数。同日，国家能源局就全国统一电力市场信用评价指引征求意见，信用等级将与履约保障直接挂钩。\n\n南方区域电力市场转入正式运行。国家发展改革委办公厅、国家能源局综合司10月14日复函原则同意，10月28日公开。南网五省都在公司电力业务的目标省之列。复函要求一体化建设运营区域市场、推动除保障性用户外的电力用户全部直接参与市场交易，并不断修订完善交易细则。保供长协高比例签约和规范零售市场也写进了复函。\n\n10月23日，国家发展改革委令第50号公布《能源保供中长期合同管理办法（试行）》，12月1日起施行，上期附录待正式稿的这件本期兑现。办法把售电公司列为电力保供中长期合同的需求方，签约比例统筹确定、由省级组织落实，同时明确各地不得强制要求签订固定价格。连同现货规则征求意见稿，2027年的持仓结构要按中长期比例和现货新规同时重算。\n\n充电线方面，国家发展改革委等五部门10月30日发布消费基础设施指导意见，专条部署充电设施建设，商业综合体等配套停车场可建大功率充电。地方层面，湖南发布虚拟电厂参与电力市场交易实施方案，把电动汽车充电设施列为可聚合的负荷类资源；江苏出台充换电设施建设财政奖补细则。加油线以地方执法为主，湖北、黑龙江商务部门在黑加油点整治、成品油执法裁量上有动作。","businessTakes":[{"business":"加油","text":"截至发稿，本月没有改变成品油定价机制、批发和装车环节规则的国家级文件。湖北的黑加油点整治与黑龙江的执法裁量基准，可以直接作为商户合规预警的地方口径。"},{"business":"充电","text":"湖南把充电设施写进虚拟电厂负荷类资源，充电负荷加售电加聚合在已进入省有了明确的准入和结算路径。消费基础设施意见与江苏奖补细则都指向商业综合体与大功率充电，场站升级的选址与成本测算有了新依据。"},{"business":"电力","text":"现货规则征求意见稿、50号令、信用评价指引三件同月，2027年的规则框架基本成形。11月18日前要就现货规则提交意见，履约保障和信用评价的资金占用要按新口径重测。南方区域转正式后，南网各省的交易细则还会修订，参数假设要按新细则逐项更新。"}],"quickTable":[{"no":"01","level":"国家级","score":"5分","title":"电力现货市场基本规则（公开征求意见稿）","issuer":"国家发展改革委","date":"10-19发布","doc_no":""},{"no":"02","level":"国家级","score":"5分","title":"关于同意南方区域电力市场转入正式运行的复函","issuer":"国家发展改革委办公厅、国家能源局综合司","date":"10-28发布","doc_no":"发改办体改〔2026〕715号"},{"no":"03","level":"国家级","score":"5分","title":"能源保供中长期合同管理办法（试行）","issuer":"国家发展改革委","date":"10-23发布","doc_no":"国家发展改革委令2026年第50号"},{"no":"04","level":"国家级","score":"4分","title":"全国统一电力市场信用评价指引（征求意见稿）","issuer":"国家能源局综合司","date":"10-19发布","doc_no":""},{"no":"05","level":"国家级","score":"3分","title":"关于加强消费基础设施建设 促进消费投资良性互动的指导意见","issuer":"国家发展改革委等五部门","date":"10-30发布","doc_no":"发改就业〔2026〕1508号"},{"no":"06","level":"地方","score":"","title":"湖南省虚拟电厂参与电力市场交易实施方案（试行）","issuer":"湖南省","date":"10-13","doc_no":""},{"no":"07","level":"地方","score":"","title":"江苏省新能源汽车充换电设施建设财政奖补资金安排实施细则","issuer":"江苏省","date":"10-09","doc_no":"苏发改能源发〔2026〕933号"},{"no":"08","level":"地方","score":"","title":"山西省电力市场管理办法","issuer":"山西省","date":"10-20","doc_no":"晋政办发〔2026〕33号"},{"no":"09","level":"地方","score":"","title":"新能源上网电价市场化有关事项通知（沪发改价管〔2026〕42号）、2026年绿电直连开发建设方案（沪发改能源〔2026〕196号）","issuer":"上海市","date":"10-20 / 10-16","doc_no":""},{"no":"10","level":"地方","score":"","title":"新能源资源市场化配置管理办法（川发改能源规〔2026〕434号）、新型储能项目建设三年行动方案（川发改能源〔2026〕478号）","issuer":"四川省","date":"10-19 / 11-04","doc_no":""},{"no":"11","level":"地方","score":"","title":"\"十五五\"电力发展规划（湘发改能源〔2026〕607号）、\"十五五\"可再生能源发展规划（湘发改能源〔2026〕620号）","issuer":"湖南省","date":"10-30 / 11-04","doc_no":""},{"no":"12","level":"地方","score":"","title":"有奖征集黑加油点线索、成品油领域行政处罚裁量基准征求意见","issuer":"湖北·黑龙江","date":"10-12 / 10-22","doc_no":""},{"no":"13","level":"地方","score":"","title":"接续发放新能源汽车和\"汽车下乡\"彩云消费券","issuer":"云南省","date":"10-01","doc_no":""}],"details":[{"no":"01","policyId":"","title":"电力现货市场基本规则（公开征求意见稿）（2026-10-19发布）","info":"关键词：全国统一·禁止地方保护·全面报量报价·节点边际电价·拉大限价·差价结算·阻塞费用·售电公司负荷数据权·2027年1月1日施行\n\n发文机关：国家发展改革委（公告）\n\n发布日期：2026-10-19　·　意见征求期：2026-10-19至2026-11-18　·　文号：无（修订发改能源规〔2023〕1217号）\n\n公告称修订是为\"加快推进全国统一电力市场建设，强化电力市场基础制度规则统一，规范电力现货市场运营和管理\"。征求意见稿十二章76条，第七十六条规定\"本规则自2027年1月1日起施行，有效期5年\"，试行版同时废止。与公司业务直接相关的条款（摘录）：\n\n- 适用与报价（第三、七条）：任何单位和个人\"不得实施地方保护、市场分割、区域壁垒等妨碍全国统一电力市场体系和公平竞争的政策\"；\"加快推进发用两侧经营主体全面报量报价参与电力市场\"。\n- 新型经营主体（第八、三十九条）：\"推动新型经营主体全面参与电力现货市场竞争，支持新型经营主体响应实时市场价格信号\"；\"原则上，实时市场出清结果应实时向经营主体发布，以便引导灵活性资源及时响应\"。\n- 价格形成（第二十三、二十七条）：\"电力现货市场原则上采用节点边际电价出清机制\"；\"具备条件的地区，应合理拉大电力现货市场限价范围\"。\n- 结算（第四十八至五十一条）：\"逐步推动区域电力现货市场和省（区、市）电力现货市场由差量结算向差价结算转变\"；\"现阶段，用户侧经营主体暂按全市场或分区的统一结算点价格结算\"；\"用户侧结算点与发电侧结算点不同产生的阻塞费用，原则上应分配给用户侧主体\"；\"电力市场结算不得设置不平衡资金池\"。\n- 售电公司权利（第十三条）：\"获得签约电力用户合同期内用电负荷等信息，根据电力用户授权获得其历史用电负荷信息\"。","reading":"现货是电力业务的主战场，2027年以后各省现货规则都要在这份规则的框架内制定。\n\n1. 框架会收敛，参数仍分省。全国适用、禁止地方保护、干预规则统一，交易模型的结构可以向一套框架收敛。限价、结算点、成本补偿仍由各省设定，选省判断要从比较规则文本转向逐省比较参数与供需。\n2. 价格波动会放大。限价\"合理拉大\"叠加节点电价方向，极端时段的高价和负价都会更深，模型的价差预测和风险敞口要按更宽的价格区间重做。结算点不同产生的阻塞费用原则上分配给用户侧，正负都会落进代理用户的结算。\n3. 聚合资源可以参与实时调节。新型经营主体全面参与、实时出清结果实时发布，充电负荷和储能可以按实时价格调节。这与湖南本月的虚拟电厂方案方向一致，充电负荷参与现货有了国家层面的依据。\n4. 结算科目会更透明也更多。不得设不平衡资金池、每项结算独立记录，各省现有的分摊科目要逐项拆开。售电公司拿到合同期内负荷数据权，用户负荷预测的数据基础更稳。","focus":"1. 限价拉大的提前公布机制、阻塞费用分配与对冲工具、聚合资源计量口径——征求意见期内各方意见的焦点，正式稿怎么写直接决定风险敞口。 [A 趁早行动]\n2. 各省现货细则按新规则的适应性修订——2027年版细则会陆续征求意见，目标省的节点电价与结算点安排要逐省核对。 [B 研究/跟进]","advice":[{"business":"电力","tag":"","text":"11月18日前按限价、阻塞费用、聚合计量三项提交书面意见；按更宽的限价区间重测各省持仓的风险敞口；把阻塞费用作为代理用户报价的单列科目。"},{"business":"充电","tag":"","text":"在已开现货的省份测算充电负荷按实时价格调节的收益，与电力业务联合设计聚合方案。"}]},{"no":"02","policyId":"","title":"关于同意南方区域电力市场转入正式运行的复函（2026-10-28发布）","info":"关键词：南方区域电力市场·正式运行·一体化建设运营·保供长协高比例签约·非保障性用户全部直接入市·规范零售市场\n\n发文机关：国家发展改革委办公厅、国家能源局综合司\n\n成文日期：2026-10-14　·　发布日期：2026-10-28　·　文号：发改办体改〔2026〕715号\n\n复函发给国家能源局南方监管局和中国南方电网有限责任公司，对其转正式运行请示作出答复。与公司业务相关的表述（摘录）：\n\n- \"原则同意南方区域电力市场转入正式运行，请认真组织实施。\"\n- 南方电网公司、南方能源监管局要\"一体化建设运营南方区域电力市场\"，\"进一步扩大市场交易范围和规模\"。\n- \"健全完善电力保供中长期合同高比例签约履约机制，完善适应新能源运行特性的市场机制，推动除保障性用户外的电力用户全部直接参与市场交易\"。\n- 要\"不断修订完善交易细则，持续升级技术平台功能，及时跟踪市场运营状况，加强信息披露和报送\"。\n- 南方能源监管局要\"加强南方区域电力市场批发交易监管，协同地方政府部门进一步规范电力零售市场\"。","reading":"复函只有五条原则，分量在于它覆盖的南网五省全部是电力业务的目标省。\n\n1. 转正式不等于规则定型。复函要求\"不断修订完善交易细则\"，区域一体化后跨省交易范围和规模扩大，省间价差和送受电安排都会变。据公开信息，广东电力交易中心已提示2027年部分关键机制和参数可能较大调整（见附录），参数假设要按新细则逐项更新。\n2. 可代理用户会增加，但扩容有节奏。除保障性用户外的电力用户全部直接参与市场交易，电网代理购电的用户将向售电公司转移。这是2021年以来的既定方向，转移速度取决于各省执行，南网各省的获客要覆盖新入市的中小工商业用户。\n3. 零售市场监管会收紧。复函把规范零售市场写进监管职责，与本月信用评价指引、上月售电办法草案方向一致。南网各省零售套餐设计与让利规则的合规要求只会更细。\n4. 保供长协高比例签约写进复函，与本月50号令衔接。南网各省的中长期签约比例会按保供要求设定，持仓结构里现货敞口的上限会被压住。","focus":"1. 南方区域正式运行版交易细则与2027年交易安排——复函要求修订完善，正式版规则是南网各省交易测算的直接输入。 [A 趁早行动]\n2. 南网各省用户直接入市的节奏——代理购电用户转入市场的时间表决定可代理用户规模。 [B 研究/跟进]\n3. 南方能源监管局的零售市场监管措施——零售套餐与让利规则的收紧方向。 [B 研究/跟进]","advice":[{"business":"电力","tag":"","text":"跟踪南方区域2027年交易安排，新细则出台后逐项更新参数假设；针对代理购电用户入市制定南网各省获客计划；对照零售监管趋势复核零售套餐与让利设计。"}]},{"no":"03","policyId":"","title":"能源保供中长期合同管理办法（试行）（2026-10-23发布）","info":"关键词：部门规章·电煤电力天然气统一规范·售电公司为需求方·签约比例·不得强制固定价格·合同转让·信用记录·12月1日施行\n\n发文机关：国家发展改革委（令）\n\n成文日期：2026-10-19　·　发布日期：2026-10-23　·　施行日期：2026-12-01　·　文号：国家发展改革委令2026年第50号\n\n办法经2026年10月15日第39次委务会议审议通过，六章45条，把电煤、电力、天然气保供中长期合同纳入统一制度。与公司业务直接相关的条款（摘录）：\n\n- 签约主体（第十八条）：电力保供中长期合同的需求方\"主要包括参与电力批发市场的售电公司和电力用户等\"。\n- 签约比例（第二十三条）：省内合同签约量应\"达到供需双方上一年度发（用）电量的一定比例\"；\"参与现货市场交易的企业，其签订的中长期合同比例应当达到能源保供相关要求\"。\n- 价格机制（第二十四条）：\"省内合同中，价格由供应方与需求方通过市场交易形成……各地不得强制要求签订固定价格。\"\n- 合同调整（第二十六条）：\"经各方协商一致，供应方、需求方均可通过市场化方式对未履行的合同全部或部分转让给第三方，相关权责一并转让\"。\n- 电煤价格与信用（第十二、四十二条）：以港口价格计算的电煤合同\"应当按照'基准价+浮动价'机制签订\"；签约履约情况\"视情纳入相关企业信用记录和信用报告\"。","reading":"办法以部门规章形式施行，约束力高于各省年度交易方案。\n\n1. 签约比例有了规章依据。售电公司被点名为需求方，签约比例按供需等因素统筹确定、由省级组织落实，\"达到能源保供相关要求\"成了参与现货的前提条件。各省2027年方案里的中长期比例下限和缺额考核以此为依据，陕西等省的征求意见稿已写入具体比例（见附录）。\n2. 批发侧可以不签固定价，零售侧要跟着改。办法明确各地不得强制要求签订固定价格，鼓励建立与供需、燃料成本关联的价格浮动机制。批发合同改为联动后，零售侧若仍以固定价为主，燃料成本上涨的风险会落在售电公司身上，零售套餐要同步转向联动。\n3. 合同转让给了调仓工具。未履行合同可以市场化转让，省级要组织灵活交易满足调整需求。中长期比例要求提高后，月内调仓的成本会成为交易团队的重要变量。\n4. 违约有了信用后果。签约履约纳入信用记录，与本月信用评价指引配套，长协履约情况会传导到履约保障额度。按信用评价指引征求意见稿，信用等级降到C级以下后，增量履约保障不能再用保险提交。","focus":"1. 各省落实签约比例的文件——2027年度交易方案会写入具体比例和缺额考核，是持仓下限的直接来源。 [A 趁早行动]\n2. 省级灵活交易机制——合同转让与月内调仓的交易品种与成本。 [B 研究/跟进]\n3. 电煤长协\"基准价+浮动价\"的年度执行口径——影响火电成本与批发价格中枢。 [C 跟踪]","advice":[{"business":"电力","tag":"","text":"按各地不得强制要求签订固定价格的规定，复核各省2027年方案中的固定价比例要求，征求意见期内据此反映；持仓模型加入签约比例下限与合同转让成本两个参数；把长协履约纳入信用管理。"}]},{"no":"04","policyId":"","title":"全国统一电力市场信用评价指引（征求意见稿）（2026-10-19发布）","info":"关键词：全国统一评价·四级·每季度·谁结算谁评价·A级降履约保障·C、D级增量凭证不得用保险·保底售电优先\n\n发文机关：国家能源局综合司\n\n成文日期：2026-10-13　·　发布日期：2026-10-19　·　反馈期限：发布之日起30日内　·　文号：无（征求意见稿）\n\n指引共24条，适用于在全国统一电力市场注册的发电企业、售电公司、电力用户和新型经营主体。与公司业务直接相关的条款（摘录）：\n\n- 统一规则（第三条）：遵循\"依法规范、公开透明、动态调整、协同联动\"的原则，\"实行统一评价规则、评价结果全国通用\"。\n- 等级与周期（第六、十三条）：结果从高到低分为A、B、C、D四级，综合得分高于85分为A级；评价\"原则上每季度开展一次\"。\n- 评价程序（第九条）：按照\"谁结算、谁评价\"的原则，各省级电力交易中心核算本省得分，北京、广州电力交易中心汇总核算综合得分。\n- 激励（第十五条）：对A级可在\"代理电量规模、业务省份推送、持续性满足注册条件核验方式和频次、容缺受理等方面提供便利服务，按规定适当降低履约保障凭证额度、扩展履约保障形式、优先选择为保底售电公司\"。\n- 约束（第十六条）：对C、D级\"按规定适当提高其履约保障凭证额度且不得以履约保险形式提交增量履约保障凭证，提高注册条件核验频次\"。","reading":"1. 信用等级会变成资金成本。上月售电办法草案已写入信用与履约保障挂钩，本指引征求意见稿给出了统一的等级和激励约束。A级可降额、可扩展履约保障形式，C级以下提额且增量凭证不能用保险，同样的售电规模，资金占用会因信用等级拉开差距。\n2. 信用得分跨省合并计算。评价结果全国通用、北京广州交易中心按权重汇总各省得分，一个省的违约或扣分会影响全部业务省份。公司多省展业，任何一个省的履约问题都会传导到其他省份的资金占用。\n3. A级能拿到额外的市场机会。优先选为保底售电公司、代理电量规模和业务省份推送上的便利，是信用带来的增量收益。按售电办法草案，被清退售电公司的用户先进入保底售电，保底资格就是获客渠道。\n4. 长协履约也会影响得分。50号令把长协签约履约纳入信用记录，长协违约、零售纠纷、注册材料问题会落到同一个信用分数上。合规管理要把交易、零售、注册三条线按一个口径统筹。","focus":"1. 评价指标体系与权重——指引只给了框架，一、二、三级指标的具体内容决定公司如何保级。 [A 趁早行动]\n2. 正式稿与售电办法正式稿的衔接——两份文件对履约保障额度的规定要一致。 [B 研究/跟进]","advice":[{"business":"电力","tag":"","text":"在反馈期内就指标透明度与跨省权重提交意见；建立各省信用得分的月度自查，把A级作为年度目标；按A级与B级两种情形测算履约保障资金占用。"}]},{"no":"05","policyId":"","title":"关于加强消费基础设施建设 促进消费投资良性互动的指导意见（2026-10-30发布）","info":"关键词：停车场配建充电·地下车库充电专区·商业综合体大功率充电·社会资本参与·公路服务节点\n\n发文机关：国家发展改革委、交通运输部、商务部、文化和旅游部、市场监管总局\n\n成文日期：2026-10-19　·　发布日期：2026-10-30　·　文号：发改就业〔2026〕1508号\n\n意见印发至各省级发展改革、交通运输、商务、文旅、市场监管部门。与公司业务直接相关的表述（摘录）：\n\n- 第（十一）条\"加大充电设施建设力度\"：\"新建、改扩建停车场，严格按照有关标准规范建设充电基础设施或预留条件。推动地下车库规划建设充电专区，配套防火分隔、自动灭火、高温报警等安全设施。\"\n- \"在客流量较大的商业街区、商业综合体、景区、文旅消费集聚区等的配套停车场，可规划建设大功率充电设施。\"\n- \"有序扩大高速公路货运繁忙路段电动重卡充换电设施覆盖范围。加强农村地区充电设施建设，推进充电设施配套电网建设改造。支持各类社会资本参与充电设施建设运营。\"\n- 第（十二）条：高速公路服务区、公路客运枢纽升级时\"按需建设公共卫生间、停车位、充电设施\"。","reading":"1. 商业综合体成为大功率充电的明确选址方向。意见把商业街区、商业综合体、景区的配套停车场列为可建大功率充电的场所，与公司的大功率升级方向一致。商业综合体内的场站常处在转供电环境，升级前要同时核电价结构和配电容量。\n2. 地下车库充电专区的安全要求会抬高改造成本。防火分隔、自动灭火、高温报警成为配套要求，存量地下场站的合规改造要提前排查。新建停车场按标准配建或预留条件，城市新增供给会更多来自停车场业主，公司的连接对象要相应扩展。\n3. 社会资本参与和地方补贴会同时加码。意见支持各类社会资本参与充电设施建设运营，江苏本月已拿出专项奖补，场站升级的资金来源可以按各省补贴口径重新排期。重卡、农村、高速三个方向在现有业务材料中未见安排，是否跟进需业务方裁定。","focus":"1. 各地停车场配建充电的标准细则——新建停车场按标准建设或预留条件，地方标准决定新增供给的节奏。 [B 研究/跟进]\n2. 地下车库充电专区的消防规范——决定存量地下场站的改造范围。 [C 跟踪]","advice":[{"business":"充电","tag":"","text":"把商业综合体配套停车场列为大功率升级的优先选址，升级前联合电力业务核场站电价与配电容量；排查存量地下场站的消防配套，列出改造清单。"},{"business":"电力","tag":"","text":"商业综合体场站升级大功率后负荷上升，可纳入售电代理与聚合方案，在已开现货省份按实时价格优化充电时段。"}]}],"localRoundup":"本月地方文件集中在聚合入市、充电补贴与消费、省级市场规则、新能源配置与储能、加油执法几条线。湖南虚拟电厂方案与江苏充换电奖补细则对公司最有操作价值，单列说明，其余并入速览。\n\n1. 湖南省虚拟电厂参与电力市场交易实施方案（试行）（2026-10-13发布，湖南省发展和改革委员会网站）\n\n关键词：负荷类资源含充电设施·售电公司资质·聚合与售电代理一致·10兆瓦门槛·服务价格上限\n\n承接国家级：方案依据国能发法改〔2024〕93号与发改能源〔2025〕357号制定，方案正文未署发文机关与文号。\n\n负荷类资源包括\"电动汽车充电设施、蓄热蓄冷、常规工业可调节负荷、商业楼宇用户等\"。虚拟电厂在中长期、现货市场开展购售电业务，\"应具备售电公司资质\"。单个虚拟电厂用电单元调节容量不小于10兆瓦、连续响应不低于1小时，且不小于正常用电负荷的10%。\n\n聚合服务合同周期不低于6个月，\"聚合代理关系应与售电代理关系保持一致，即该用户已由售电公司代理购电，只能由该售电公司的对应的虚拟电厂运营商聚合代理参与市场交易\"。已按售电公司身份缴纳履约保函的无需重新缴纳。\n\n对公司业务：湖南是电力业务已进入省。方案把充电设施写进负荷类资源，又要求聚合关系跟随售电代理关系，充电场站的聚合只能由代理其售电的售电公司及其对应的虚拟电厂运营商完成。公司同时持有售电资质和充电负荷，在湖南可以把两者打包。本刊的推论是，没有售电资质的聚合商在湖南很难单独争取充电负荷。这一要求针对电能量市场的聚合代理，10兆瓦门槛要按湖南场站的可调容量逐站核算。[A 趁早行动]\n\n2. 江苏省新能源汽车充换电设施建设财政奖补资金安排实施细则（苏发改能源发〔2026〕933号，2026-09-30成文、10-09公开，江苏省发展改革委等四部门）\n\n关键词：1.5亿元·大功率乡村小区6:3:1·兆瓦级按功率补·接入省监测平台·2027年10月底前投运\n\n承接国家级：依据国办发〔2023〕19号和国家大功率充电设施规划建设要求制定。奖补资金共1.5亿元，为一次性建设补助，大功率公共充换电设施、乡村地区公共充换电设施、居住小区\"统建统服\"充电设施原则上按6:3:1分配。支持细则印发后至2026年底前新备案、2027年10月底前建成投运的项目。兆瓦级充电设施按核算功率补助，居住小区\"统建统服\"每个公共充电车位奖补3000元。苏中苏北上浮10%，2026年底前开工再上浮5%。项目投运后要接入江苏省新能源汽车充电设施运营监测服务平台，获得过中央财政试点资金、超长期特别国债等国家资金支持的项目不得申报。\n\n对公司业务：江苏是电力业务目标省。六成资金投向大功率公共充电，2026年底前备案是申报门槛，存量场站升级要赶在年内完成备案。乡村与居住小区在现有业务材料中未见安排，是否跟进需业务方裁定。[A 趁早行动]\n\n3. 其他地方政策合并速览\n\n省级市场框架方面，山西省政府办公厅10月17日印发《山西省电力市场管理办法》（晋政办发〔2026〕33号，10月20日公开），把发电企业、售电公司、电力用户和储能企业、虚拟电厂、负荷聚合商等新型经营主体纳入统一框架。山西不是目标省，只作省级规则参照。上海10月20日公布通知，推动新能源上网电量全部进入市场，项目可报量报价直接参与，也可聚合后参与；10月16日公布2026年绿电直连开发建设方案，3个项目纳入，其中2个进入实施库。\n\n新能源配置与储能方面，四川10月15日印发新能源资源市场化配置管理办法（川发改能源规〔2026〕434号），规范集中式风光资源的统筹与遴选。四川10月27日组织电网侧独立新型储能项目申报，11月3日印发新型储能项目建设三年行动方案（川发改能源〔2026〕478号）。四川是目标省，电力业务项下储能项目当前暂停，三件只作跟踪。湖南10月30日、11月4日先后公布\"十五五\"电力发展规划和可再生能源发展规划（分别于10月30日、10月29日印发），两份规划全文以附件发布，已进入省的五年电源与负荷布局要据此更新。\n\n加油线方面，湖北省商务厅10月12日配合全省黑加油点整治，联合省石油成品油流通行业协会公开有奖征集违法线索。黑龙江省商务厅10月22日就成品油领域行政处罚裁量基准征求意见。烟台公布\"十五五\"期间拟新增加油站点位，常州公布2025年度成品油零售企业年检情况。各省执法裁量与年检结果可作为商户合规预警的地方数据源。\n\n充电消费方面，云南10月1日起接续发放新能源汽车和\"汽车下乡\"彩云消费券，至11月30日结束。新能源汽车消费券与私家车需求直接相关，下乡部分涉及的农村场景在现有业务材料中未见安排，是否跟进需业务方裁定。","appendix":"以下动向的正式文本尚待取得、发布时间贴近本期边界，或经裁定只进附录，据公开信息提示提前关注：\n\n1. 两部国家基础规则的有效期——据公开信息，《电力现货市场基本规则（试行）》有效期至2026年10月15日，2021年版《售电公司管理办法》有效期至2026年11月11日，截至11月11日均未见延期公告，新稿都拟2027年1月1日施行。售电办法征求意见情况通告称收到意见133条，截至11月11日正式稿尚未印发。\n2. 国家能源局10月30日新闻发布会——据公开信息，售电公司3743家，1至9月新增878家、退出374家；售电公司管理办法、《电力零售市场基本规则》、电力市场风险防控管理办法即将出台。《电力零售市场基本规则》尚未见征求意见稿，风险防控办法征求期已于10月30日结束。\n3. 陕西三件征求意见稿——2027年电力市场化交易实施方案（10月19日，11月18日截止）提出用电侧年度签约比例70%（含约25%机制电量），缺额按燃煤基准价的15%考核回收。同一集团发电企业与售电公司双边协商电量原则上不超过该集团本地总交易电量的20%。优化分时电价政策通知（10月30日，11月13日截止）拟把系统运行费纳入工商业峰谷浮动，高峰上浮70%、尖峰上浮90%、低谷下浮70%，2027年起执行一年。零售细则修订建议要求售电公司上架分时套餐。陕西是已进入省，分时电价一条会拉大峰谷价差，与储能暂停的前提相反，正式稿出台后专项评估。\n4. 其他目标省2027年方案——据公开信息，四川2027年电力市场交易总体方案11月3日征求意见、12月2日截止，浙江2027年市场化交易方案10月30日征求意见，陕西现货实施细则2027年版11月6日征求意见。江苏电力交易中心2027年零售交易指引取消固定价格电量比例、现货联动比例、比例分成等要求。福建电力交易中心2027年零售细则取消纯固定价格与价差分享套餐、新增固定价格加市场均价套餐。广东、湖南2027年方案截至发稿未正式公布，广东电力交易中心10月16日提示2027年部分关键机制和参数可能较大调整，11月4日发布电力市场自律公约，未签署的主体将无法办理零售相关业务。\n5. 广东2026年新能源机制电价竞价——广东省发展改革委、省能源局粤发改价格函〔2026〕1805号，分布式光伏初始规模79.34亿千瓦时，竞价上限每千瓦时0.4元、下限0.2元，执行期12年。\n6. 待正式稿的几件——电力并网运行管理规定、电网公平开放监管办法、供电企业信息公开实施办法均未见正式稿；华北区域省间中长期细则10月9日征求截止，正式稿未见。\n7. 立法与价格监管——据公开信息，全国人大常委会11月2日初审可再生能源法修订草案，拟写入统一电力市场与可持续发展价格结算机制。国务院常务会议10月16日原则通过价格法修正草案，治理低价倾销、规范平台价格竞争。市场监管总局《市场监督管理行政处罚裁量规定》2027年1月1日施行。市场监管总局10月16日通报，2025年以来加油机作弊整治立案399件、罚没款1.43亿元，并转入常态化监管。\n8. 信用与充电数据——据公开信息，国家发展改革委11月9日印发全国守信激励措施基础清单（2026年版），把电力行业信用评价A级列入联合激励。10月国家层面未见充电专项文件，1508号意见的充电专条见正文；据中国充电联盟，9月底公共充电设施520.7万个、同比增长16.3%。\n9. 其他动向——国家能源局10月21日公开煤电与新能源融合发展实施意见（国能发电力〔2026〕69号），融合项目可参与电力、碳市场交易。国家能源局综合司11月5日公开电力企业安全生产费用提取和使用通知（9月30日制发）。湖南\"十五五\"电力发展规划据解读提出2030年充电桩120万个，规划正文待取得。","uncovered":"","caveats":[]}}}</script>
