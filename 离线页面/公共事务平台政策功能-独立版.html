<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>公共事务平台政策功能(独立版演示)</title>
<style>
/* 独立版补的:原平台的全局样式(颜色变量、卡片、按钮、标签等)是同事写的,不在本仓。
   这里只给我的页面和组件用到的那些名字一个最小定义,数值是独立版自己定的。 */
:root {
  --ink: #0f172a;
  --ink-1: #0f172a;
  --ink-2: #334155;
  --ink-3: #64748b;
  --ink-4: #94a3b8;
  --line: #e2e8f0;
  --line-2: #edf1f6;
  --bg: #f5f6f8;
  --bg-1: #f8fafc;
  --bg-2: #f1f5f9;
  --white: #ffffff;
  --orange: #f97316;
  --orange-2: #ea580c;
  --orange-soft: #fff1e6;
  --orange-soft-2: #fed7aa;
  --red: #dc2626;
  --red-soft: #fee2e2;
  --amber: #b45309;
  --shadow-lg: 0 12px 32px rgba(15, 23, 42, 0.14);
  color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 14px/1.5 -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", "Segoe UI", sans-serif;
  -webkit-font-smoothing: antialiased;
}
button, input, select, textarea { font: inherit; color: inherit; }
.boot-status { padding: 40px 20px; text-align: center; color: var(--ink-3); }

/* 页头 */
.page-head { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.page-title { font-size: 19px; font-weight: 700; color: var(--ink); }
.page-sub { margin-top: 3px; font-size: 12.5px; color: var(--ink-3); }

/* 卡片、空状态 */
.card { background: var(--white); border: 1px solid var(--line); border-radius: 10px; padding: 12px 14px; }
.empty { padding: 28px 12px; text-align: center; color: var(--ink-3); font-size: 13px; }

/* 筛选条、按钮 */
.filter-bar { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; }
.filter-select { height: 34px; min-width: 140px; padding: 0 10px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); color: var(--ink); }
.btn { height: 34px; padding: 0 14px; border: 1px solid var(--line); border-radius: 8px; background: var(--white); color: var(--ink-2); cursor: pointer; font-weight: 600; }
.btn:hover { border-color: var(--orange-soft-2); background: var(--bg-1); }
.btn:disabled { opacity: 0.6; cursor: default; }
.btn-primary { background: var(--orange); border-color: var(--orange); color: #fff; }
.btn-primary:hover { background: var(--orange-2); border-color: var(--orange-2); }

/* 标签、辅助文字 */
.pill { display: inline-flex; align-items: center; height: 22px; padding: 0 8px; border-radius: 11px; font-size: 12px; font-weight: 600; }
.pill-amber { background: #fff7e6; color: var(--amber); }
.tbl-time { font-size: 12px; color: var(--ink-3); }
.tbl-meta { font-size: 12px; color: var(--ink-3); }

/* 拜访录入弹窗原来是手机上的底部弹层;宽屏演示时收窄居中,模拟手机宽度 */
@media (min-width: 640px) {
  body .mi-mask { justify-content: center; }
  body .mi-mask .mi-panel { max-width: 440px; }
}

ctions":["A 趁早:趁早核对公司在湘县域既有与规划站点与这21个公示县（市）的交集，将2026年建桩节奏与选址优先级向名单县域对齐；公示期仅9月16—18日，如有异议须在期内以传真或邮件向省能源局电力处（0731-89665047，fgwnyjdlc@hunan.gov.cn）具名提出并列明理由与证明材料。","B 研究:调取并研究本公示的两份依据文件——《关于开展2026年县域充电设施补短板申报工作的通知》与湘工信装备〔2026〕211号，弄清县域补短板的支持方式、申报与验收要求、是否有运营商准入门槛，据此判断名单县域内单站收益模型与投资回收，再决定投入多少资源。"]},{"id":"P_2026_HN_FGW_378","title":"湖南省发展和改革委员会关于明确充换电基础设施新建或改扩建投资项目备案管理有关事项的通知","issuer":"","region":"湖南省","date":"2026-07-02","oneLiner":"","readingValue":"","summary":"","actions":["A 趁早：梳理湖南省内在建或拟建的充换电项目，对投资额接近或超过5000万元的项目，按打捆申报要求准备备案材料，争取省发改委统一备案红利。","B 研究：详细了解省发改委备案的具体流程、材料清单及打捆申报规则，优化内部项目立项和审批节奏，确保政策期内充分受益。"]},{"id":"P_2026_HN_FGW_37c62fa1","title":"湖南省虚拟电厂参与电力市场交易实施方案（试行）","issuer":"","region":"湖南省","date":"2026-10-13","oneLiner":"","readingValue":"","summary":"","actions":["A 趁早:由电力业务团队下载省发改委原文附件（方案.docx），逐条提取准入条件、可聚合资源类型、结算与考核口径，对照本文件 decision_variables 判定湖南是否需要进入电力业务目标省清单。","B 研究:若公司在湖南持有充电场站或储能资产，在原文确认充电桩/储能/V2G是否被列为可聚合资源之前，仅做资源台账梳理与规则比对，不做投资、合作或业务承诺。","C 研究:建立省级VPP与聚合商政策跟踪模板（准入资质/可聚合资源/结算机制/考核上限四栏），用于后续同类省级方案横向比较与优先级排序。"]},{"id":"P_2026_HN_FGW_460","title":"湖南省发展和改革委员会关于省电网第四监管周期输配电价及有关事项的通知","issuer":"","region":"湖南省","date":"2026-07-31","oneLiner":"","readingValue":"","summary":"","actions":["A 趁早: 测算湖南省第四监管周期各电压等级输配电价对现有电力用户侧成本的影响，重新审视用电成本结构。","B 研究: 跟踪后续输配电价表及实施细则，结合自身负荷特性评估电价变化对充电、储能等业务盈利模型的潜在影响。"]},{"id":"P_2026_HN_FGW_5c92a852","title":"关于调整成品油价格的通知(2026年9月24日)","issuer":"","region":"湖南省","date":"2026-09-24","oneLiner":"","readingValue":"","summary":"","actions":["A 趁早:以2026年9月24日24时为界,核对湖南在营站点的批发结算价与零售挂牌价,确认每吨300元(配送至零售企业)与每吨400元(民营批发企业)的扣减机制在调价后照常足额执行,防止折扣空间被压缩。","B 趁早:按最高零售价格管理要求,在限价内完成站点价签、系统价格与对外报价口径的同步更新,并留存价格执行记录,以应对各级价格主管部门的动态与价格监测。","C 研究:复盘本次调价前后湖南批零价差与批发折扣空间的实际变化,评估国家后续调控节奏对采购时点、站点毛利及下沉城市展业的影响提示。"]},{"id":"P_2026_HN_FGW_688","title":"关于推动多用户绿电直连发展有关事项的通知","issuer":"","region":"湖南省","date":"2026-09-18","oneLiner":"","readingValue":"","summary":"","actions":["A 趁早:按正文“投资模式”口径（项目须明确具备法人资格的独立主责单位，原则上由电源方与负荷方合资，园区型可由园区管委会或第三方机构组建，且不含运营220千伏及以上输变电业务的公共电网企业）评估公司在目标省以第三方机构或负荷方身份介入园区型绿电直连项目的可行性与合规边界。","B 研究:以正文“以荷定源”及年自发自用电量≥60%、占总用电量≥30%（2030年前≥35%）的硬约束为参数，测算湖南绿电直连项目落地对目标省售电代理电量、绿电供给结构与现货持仓比例的间接分流，判断是否需调整中长期签约与持仓节奏。","C 研究:核实正文“适用负荷”范围（工业园区、零碳园区、增量配电网等）是否覆盖公司现有充电场站所在园区，形成是否需要人工裁定的结论；正文未提及充电设施，在裁定前不作建桩、定价或参与绿电直连的业务动作。"]},{"id":"P_2026_HN_FGW_70f79607","title":"关于调整成品油价格的通知（2026年7月31日）","issuer":"","region":"湖南省","date":"2026-07-31","oneLiner":"","readingValue":"","summary":"","actions":["A 趁早: 按新调整的汽柴油最高零售价格和最高批发价格，梳理湖南地区加油站点与批发环节的价格表，更新系统价格参数，确保7月31日24时后合规执行。","B 趁早: 结合最高批发价格与配送扣减规则（零售企业每吨扣减300元、民营批发企业扣减400元），复核与供应商的合同配送条款及价格核算，规避价格执行偏差。","C 研究: 油价上调后，可研究燃油车与电动车使用成本对比变化对充电需求的间接影响，作为中长期充电业务布局的参考，但需注意该政策本身未创设充电业务相关机制。"]},{"id":"P_2026_HN_FGW_8646b73d","title":"关于调整成品油价格的通知(2026年6月4日)","issuer":"","region":"湖南省","date":"2026-06-04","oneLiner":"","readingValue":"","summary":"","actions":["A 趁早: 根据新价格下调幅度，重新核算加油站点终端定价与批发成本，优化库存周转和调运计划以降低采购成本。","B 研究: 跟踪本次降价后的市场反应，评估对加油业务量及利润的影响，并为后续价格调整预案做好准备。"]},{"id":"P_2026_HN_FGW_d237c3d8","title":"关于调整成品油价格的通知(2026年7月3日)","issuer":"","region":"湖南省","date":"2026-07-03","oneLiner":"","readingValue":"","summary":"","actions":["A 趁早: 根据最新批发价差调整湖南地区加油站的零售定价策略，确保不超最高零售价同时维持合理利润空间。","B 研究: 密切跟踪本次调价后湖南成品油市场供需及价格异常报告机制，评估对运营成本的短期影响。"]},{"id":"P_2026_HN_FGW_d32cfeea","title":"关于调整成品油价格的通知(2026年9月11日)","issuer":"","region":"湖南省","date":"2026-09-11","oneLiner":"","readingValue":"","summary":"","actions":["A 趁早:按2026年9月11日24时生效的新价,重算湖南在营及待开站点的最高批发采购成本、批零折扣空间与单站毛利,同步更新零售挂牌价区间。","B 趁早:趁早与省公司及符合资质的民营批发渠道核对300元/吨、400元/吨扣减口径与未约定配送时的运杂费协商规则,把差价下限条款落进采购/供应合同。","C 研究:研究'市场零售价下调时供应价同降、差价不低于300元和400元'对长期采购协议与折扣空间的持续约束,并对照该省价格监测与异常报告要求排查合规动作。"]},{"id":"P_2026_HN_FGW_def26ce0","title":"关于调整成品油价格的通知(2026年8月28日)","issuer":"","region":"湖南省","date":"2026-08-28","oneLiner":"","readingValue":"","summary":"","actions":["A 趁早：按新最高零售价格调整加油站销售价格与价格标签，确保8月28日24时准时执行。","B 趁早：复核批发环节配送扣减标准，与合同约定配送方式衔接，避免供应价格与零售价格倒挂。","C 研究：根据本次价格调整后的市场价差，评估加油站零售策略与库存调度安排。"]},{"id":"P_2026_HN_FGW_e3325faf","title":"关于调整成品油价格的通知(2026年7月17日)","issuer":"","region":"湖南省","date":"2026-07-17","oneLiner":"","readingValue":"","summary":"","actions":["趁早根据省发改委调价通知，在不超过最高零售价范围内调整下属加油站的汽柴油零售挂牌价，并同步更新批发结算与配送扣减机制。","趁早配合中石化、中石油省级公司的调运衔接要求，确保调价过渡期加油站库存平稳，同时启动价格监测日报机制，及时向主管部门反馈异常波动。"]},{"id":"P_2026_HN_FGW_f20bdb13","title":"关于调整成品油价格的通知(2026年8月14日)","issuer":"","region":"湖南省","date":"2026-08-14","oneLiner":"","readingValue":"","summary":"","actions":["A 趁早:对照湖南省最新汽、柴油最高零售价调整附件，复核旗下加油站挂牌价与调价时间，确保不超最高零售价并同步执行自2026年8月14日24时起的价格。","B 趁早:根据批发价格扣减规则（配送到零售企业扣减300元/吨、符合资质的民营批发企业扣减400元/吨），重新梳理采购与配送合同中的价格条款，核算价差空间。","C 研究:关注各级价格主管部门对成品油市场动态和价格监测的要求，提前准备价格异常情况下的内部报告与应对流程。"]},{"id":"P_2026_JS_FGW_4cc6da7c","title":"中城大有六合龙袍50MW/100MWh储能电站项目送出工程获批","issuer":"","region":"南京市","date":"2026-06-10","oneLiner":"","readingValue":"","summary":"","actions":["趁早: 梳理南京及周边已核准或待核准的储能送出工程项目，评估公司参与类似送出工程建设的可行性，并主动对接属地发改、规划部门获取后续项目信息。","研究: 关注该储能电站（50MW/100MWh）后续调试、并网及运营动态，跟踪其调峰调频、容量市场收益情况，为公司同类储能项目投资决策提供参考。"]},{"id":"P_2026_JS_FGW_50","title":"关于公布南京地区电网负荷可开放容量信息的通知（2026年...","issuer":"","region":"南京市","date":"2026-07-03","oneLiner":"","readingValue":"","summary":"","actions":[]},{"id":"P_2026_JS_FGW_695","title":"关于印发《江苏省分布式光伏发展实施方案（2026-2030年）》的通知","issuer":"","region":"江苏省","date":"2026-07-29","oneLiner":"","readingValue":"","summary":"","actions":["趁早布局园区分布式光伏配套储能项目，结合“同步配套建设电网和储能设施”要求，储备园区级储能资源。","趁早研究虚拟电厂聚合平台参与需求响应和电力现货市场的业务模式，对应“鼓励园区配套建设虚拟电厂聚合平台”政策方向。","趁早评估绿电直连、绿电直供业务机会，围绕“以荷定源”原则对接有刚性降碳、绿电物理溯源需求的用户。"]},{"id":"P_2026_JS_FGW_777","title":"省发展改革委转发国家发展改革委关于第四监管周期省级电网输配电价、区域电网输电价格及有关事项的通知","issuer":"","region":"江苏省","date":"2026-08-24","oneLiner":"","readingValue":"","summary":"","actions":["趁早对照附件《江苏电网输配电价表》，测算各电压等级工商业用电的输配电价及各项分摊变化，重算充电场站单位度电成本和项目回报，评估对选址与运营策略的影响。","趁早研究抽水蓄能抽发按现货价格结算及收益分享机制对江苏现货价格中枢和系统运行费分摊的影响，优化电力交易与中长期持仓结构，防止成本预测偏差。"]},{"id":"P_2026_JS_FGW_933","title":"关于印发《江苏省新能源汽车充换电设施建设财政奖补资金安排实施细则》的通知","issuer":"","region":"江苏省","date":"2026-10-09","oneLiner":"","readingValue":"","summary":"","actions":["A 趁早:对照奖补时间窗口（2026年底前
