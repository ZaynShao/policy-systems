# MA1b web 双保险的配置。
#
# 只有搜索腿在跑。定向抓列表页那条腿**有意留空**:
# 跨条线(税务、金融)的系统性漏采,根治在 L1 的渠道注册表——把国家税务总局这类
# 非能源口来源加进 channel_registry,漏采在源头就堵住了;在 L3 里再写一个爬虫,
# 等于把 L1 的渠道机器重造一遍,而且每月只在出刊时补一次。
# 该项另开任务。这里保留配置位,读到非空时才走腿 1。

search:
  max_results_per_query: 5
  # 查询由战略画像里 weight: high 的信号 what 字段 + 月份自动构造,不在这里写死——
  # 写死一份查询词表就是又一份会走散的手写副本(见 vault _meta/framework/index.yaml)。

directory_sources: []   # 扩展点,当前为空;非空时才走腿 1
