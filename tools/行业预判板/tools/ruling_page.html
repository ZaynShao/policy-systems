<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>裁定台 · 行业预判板 2026-09-15</title>
<style>
:root{
  --orange:#F97316;--orange-2:#EA580C;--orange-soft:#FFF7ED;--orange-soft-2:#FFEDD5;--orange-border:#FDBA74;
  --bg:#F8FAFC;--bg-2:#F1F5F9;--white:#FFFFFF;
  --ink:#0F172A;--ink-2:#334155;--ink-3:#64748B;--ink-4:#94A3B8;--ink-5:#CBD5E1;
  --line:#E2E8F0;--line-2:#F1F5F9;
  --blue:#3B82F6;--blue-soft:#EFF6FF;--green:#10B981;--green-2:#059669;--green-soft:#ECFDF5;
  --red:#EF4444;--red-2:#DC2626;--red-soft:#FEF2F2;--purple:#8B5CF6;--purple-soft:#F5F3FF;
  --amber:#F59E0B;--amber-2:#B45309;--amber-soft:#FFFBEB;
  --shadow:0 1px 3px 0 rgba(15,23,42,.05),0 1px 2px -1px rgba(15,23,42,.05);
  --sans:'Inter','PingFang SC','Microsoft YaHei','Hiragino Sans GB',sans-serif;
  --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:13px;line-height:1.55;-webkit-font-smoothing:antialiased;padding-inline:20px;padding-block:0 60px}
button{font-family:inherit;cursor:pointer}
a.ext{color:var(--orange-2);text-decoration:underline;text-decoration-color:var(--orange-border);text-underline-offset:2px}
:focus-visible{outline:2px solid rgba(249,115,22,.55);outline-offset:1px}
.num{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:.92em}
.top{position:sticky;top:0;z-index:5;background:rgba(248,250,252,.92);backdrop-filter:blur(6px);border-bottom:1px solid var(--line);margin-inline:-20px;padding:10px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.top h1{font-size:16px;margin:0;font-weight:700}
.top .sub{color:var(--ink-3);font-size:12px}
.top .grow{flex:1}
.prog{font-size:12px;color:var(--ink-2)}
.prog b{color:var(--orange-2)}
.btn{border:1px solid var(--line);background:var(--white);color:var(--ink-2);border-radius:8px;padding:6px 12px;font-size:12px;font-weight:600}
.btn:hover{border-color:var(--ink-4)}
.btn.primary{background:var(--orange);border-color:var(--orange);color:#fff}
.btn.primary:hover{background:var(--orange-2)}
.toast{font-size:12px;color:var(--green-2);min-width:120px}
.toast.err{color:var(--red-2)}
.layout{display:grid;grid-template-columns:230px 1fr;gap:22px;max-width:1240px;margin:18px auto 0}
.nav{position:sticky;top:58px;align-self:start;max-height:calc(100vh - 70px);overflow:auto;background:var(--white);border:1px solid var(--line);border-radius:12px;padding:8px}
.nav a{display:flex;align-items:center;gap:6px;padding:6px 8px;border-radius:8px;color:var(--ink-2);text-decoration:none;font-size:12px}
.nav a:hover{background:var(--bg-2)}
.nav a .n{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav a .t{font-family:var(--mono);font-size:11px;color:var(--ink-3);white-space:nowrap}
.nav a .t.chg{color:var(--orange-2);font-weight:600}
.nav a .c{font-size:10px;padding:1px 6px;border-radius:999px;background:var(--bg-2);color:var(--ink-3)}
.nav a .c.done{background:var(--green-soft);color:var(--green-2)}
.nav a .c.todo{background:var(--orange-soft-2);color:var(--orange-2)}
.nav .h{font-size:10px;letter-spacing:.06em;color:var(--ink-4);padding:8px 8px 2px;text-transform:uppercase}
.sec{margin-bottom:26px}
.sec h2{font-size:14px;margin:0 0 10px;display:flex;align-items:baseline;gap:10px}
.sec h2 .meta{font-size:12px;color:var(--ink-3);font-weight:500}
.item{background:var(--white);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px;box-shadow:var(--shadow)}
.item.done{border-color:#BBF7D0}
.item.moot{opacity:.6}
.item .hd{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:6px}
.chip{font-size:10.5px;padding:2px 7px;border-radius:6px;background:var(--bg-2);color:var(--ink-3);font-weight:600;letter-spacing:.02em}
.chip.id{font-family:var(--mono);background:var(--ink);color:#fff}
.chip.rule{background:var(--blue-soft);color:#1D4ED8}
.chip.kind{background:var(--purple-soft);color:#6D28D9}
.item h3{font-size:14px;margin:0 0 6px;text-wrap:balance}
.item .q{color:var(--ink-2);margin:0 0 8px;max-width:78ch}
.item details{margin:4px 0 8px}
.item details>summary{cursor:pointer;font-size:12px;color:var(--ink-3);font-weight:600}
.item details>summary:hover{color:var(--orange-2)}
.ctx{color:var(--ink-3);font-size:12px;border-left:3px solid var(--line);padding-left:10px;margin:6px 0;max-width:80ch}
table.nodes{border-collapse:collapse;width:100%;font-size:12px;margin:6px 0 10px}
table.nodes th{text-align:left;color:var(--ink-4);font-weight:600;font-size:11px;padding:4px 6px;border-bottom:1px solid var(--line)}
table.nodes td{padding:5px 6px;border-bottom:1px solid var(--line-2);vertical-align:top}
table.nodes td.id{font-family:var(--mono);white-space:nowrap}
.push{display:inline-block;font-family:var(--mono);font-size:11px;padding:1px 6px;border-radius:5px;font-weight:700}
.push.up{background:var(--red-soft);color:var(--red-2)}
.push.dn{background:var(--green-soft);color:var(--green-2)}
.push.z{background:var(--bg-2);color:var(--ink-3)}
.use{color:var(--ink-3);font-size:11.5px;margin-top:2px}
.card{background:var(--orange-soft);border:1px solid var(--orange-border);border-radius:10px;padding:10px 12px;margin:6px 0 10px;font-size:12px}
.card b{color:var(--orange-2)}
.card ul{margin:4px 0 0;padding-left:18px}
.opts{display:grid;gap:6px;margin:8px 0}
.opt{display:grid;grid-template-columns:18px 1fr;gap:10px;align-items:start;padding:9px 12px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--white)}
.opt:hover{border-color:var(--ink-4)}
.opt.sel{border-color:var(--orange);background:var(--orange-soft)}
.opt input{margin-top:3px}
.opt .l{font-weight:600}
.opt .d{color:var(--ink-3);font-size:12px;margin-top:2px}
.opt .rec{font-size:10px;padding:1px 6px;border-radius:999px;background:var(--orange);color:#fff;margin-left:6px;vertical-align:1px}
.opt .eff{font-family:var(--mono);font-size:11px;color:var(--ink-3);margin-top:4px}
.opt .eff .chg{color:var(--orange-2);font-weight:600}
.why{font-size:12px;color:var(--ink-2);background:var(--bg-2);border-radius:8px;padding:8px 10px;margin:6px 0 8px;max-width:80ch}
.why b{color:var(--ink)}
textarea.note{width:100%;border:1px solid var(--line);border-radius:8px;padding:7px 9px;font-family:inherit;font-size:12px;min-height:38px;resize:vertical;background:var(--white)}
textarea.note.req{border-color:var(--orange)}
.mootbar{font-size:12px;color:var(--amber-2);background:var(--amber-soft);border:1px solid #FDE68A;border-radius:8px;padding:6px 10px;margin:6px 0}
.dirlist{display:grid;gap:6px}
.dir{display:grid;grid-template-columns:18px 130px 60px 1fr;gap:10px;align-items:start;padding:8px 10px;border:1px solid var(--line);border-radius:10px;font-size:12px}
.dir .st{font-weight:700}
.dir .st.s{color:var(--green-2)}.dir .st.n{color:var(--ink-3)}.dir .st.r{color:var(--red-2)}
.dir .b{color:var(--ink-3)}
.dir .fixed{color:var(--green-2);font-weight:600}
.rules{font-size:12px;color:var(--ink-2);columns:2;column-gap:28px;max-width:100%}
.howto{background:var(--white);border:1px solid var(--orange-border);border-left:4px solid var(--orange);border-radius:12px;padding:12px 16px;margin-bottom:20px;font-size:13px;max-width:100%}
.howto p{margin:6px 0 0;max-width:90ch;color:var(--ink-2)}
.howto .legend{color:var(--ink-3);font-size:12px}
.rules li{break-inside:avoid;margin-bottom:4px}
ul.res{font-size:12px;color:var(--ink-2);padding-left:18px}
ul.res li{margin-bottom:4px;max-width:90ch}
@media (max-width:820px){
  .layout{grid-template-columns:1fr}
  .nav{position:static;max-height:none;display:flex;flex-wrap:wrap;gap:2px}
  .nav .h{width:100%}
  .rules{columns:1}
  .dir{grid-template-columns:18px 1fr}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="top">
  <h1>裁定台 · 行业预判板</h1>
  <span class="sub" id="round"></span>
  <span class="grow"></span>
  <span class="prog" id="prog"></span>
  <button class="btn" id="btnRec" type="button">还没选的都按我的建议填</button>
  <button class="btn primary" id="btnSave" type="button">保存裁定</button>
  <span class="toast" id="toast"></span>
</div>
<div class="layout">
  <nav class="nav" id="nav"></nav>
  <main id="main"></main>
</div>
<script>
const S = {state:null, choices:{}, notes:{}, dirs:{}, preview:null, timer:null};
const GROUP_NAME = {global:'算法规则(先定这两条)', direction:'产业方向确认'};
const PUSH_CN = {up:'收紧', dn:'支持', '0':'不计入'};
const TIER_CN = {S1:'S1 官方原文', S2:'S2 央媒', S3:'S3 其他', S4:'S4 内部件'};
const KIND_CN = {push:'这份文件怎么算', rule:'算法规则', scope:'范围与待办', tier:'证据等级', confirm:'请确认', text:'文字内容', direction:'产业方向'};
const STANCE_CN = {risk:'监管趋严', support:'监管放宽', mixed:'并行', watch:'平稳'};
const $ = (s, el=document) => el.querySelector(s);
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

async function load(){
  S.state = await (await fetch('/api/state')).json();
  const sv = S.state.saved;
  if (sv){ S.choices = sv.choices || {}; S.notes = sv.notes || {}; S.dirs = sv.directions_confirmed || {}; }
  else { for (const k of S.state.order){ S.dirs[k] = true; } }
  $('#round').textContent = S.state.round + (sv ? ' · 上次保存 ' + sv.saved_at : ' · 尚未保存');
  render(); schedulePreview();
}

function groups(){
  const st = S.state, out = [], seen = new Set();
  for (const it of st.items){ if (!seen.has(it.group)){ seen.add(it.group); out.push(it.group); } }
  return out;
}
function groupLabel(g){ return GROUP_NAME[g] || (S.state.industries[g] ? S.state.industries[g].name : g); }
function isMoot(it){ if (!it.moot_if) return false; return Object.entries(it.moot_if).every(([k,v]) => S.choices[k] === v); }
function decidable(){ return S.state.items.filter(it => it.id !== 'DIR' && !isMoot(it)); }

function render(){
  const st = S.state, main = $('#main'), nav = $('#nav');
  let html = `<div class="howto"><b>怎么看这页</b><p>${esc(st.howto)}</p><p class="legend">${esc(st.legend)}</p></div>`;
  for (const g of groups()){
    const items = st.items.filter(it => it.group === g);
    const ind = st.industries[g];
    html += `<section class="sec" id="g-${g}"><h2>${esc(groupLabel(g))}` +
      (ind ? `<span class="meta">现在温度 <span class="num">${ind.temp}</span>(${esc(ind.stance_cn)})· 产业方向:${esc(ind.direction.stance)} · 这一年采到 ${ind.n_nodes} 份文件</span>` : '') + `</h2>`;
    for (const it of items) html += it.id === 'DIR' ? renderDir(it) : renderItem(it);
    html += '</section>';
  }
  html += `<section class="sec" id="g-rules"><h2>已按既定规则处理、不用你定的</h2><ul class="res">${st.resolved_by_rule.map(r => `<li>${esc(r)}</li>`).join('')}</ul>
    <h2 style="margin-top:14px">已定规则(白话版)</h2><ul class="rules">${Object.entries(st.rules).map(([k,v]) => `<li><b>${esc(k)}</b> ${esc(v)}</li>`).join('')}</ul></section>`;
  main.innerHTML = html;
  main.querySelectorAll('input[type=radio][data-item]').forEach(r => r.addEventListener('change', e => { S.choices[e.target.dataset.item] = e.target.value; onChange(); }));
  main.querySelectorAll('textarea.note').forEach(t => t.addEventListener('input', e => { S.notes[e.target.dataset.item] = e.target.value; updateProgress(); }));
  main.querySelectorAll('input[type=checkbox][data-dir]').forEach(c => c.addEventListener('change', e => { S.dirs[e.target.dataset.dir] = e.target.checked; updateProgress(); }));
  renderNav(); updateProgress(); applyPreview();
}

function renderItem(it){
  const st = S.state, moot = isMoot(it), ch = S.choices[it.id];
  let h = `<article class="item ${ch && !moot ? 'done' : ''} ${moot ? 'moot' : ''}" id="it-${it.id}">
    <div class="hd"><span class="chip id">${esc(it.id)}</span><span class="chip rule">${esc(it.rule)}</span><span class="chip kind">${esc(KIND_CN[it.kind] || it.kind)}</span></div>
    <h3>${esc(it.title)}</h3><p class="q">${esc(it.question)}</p>`;
  if (it.context) h += `<details><summary>调研组原话(内部用语)</summary><div class="ctx">${esc(it.context)}</div></details>`;
  if (it.nodes && it.nodes.length){
    h += `<table class="nodes"><thead><tr><th>编号</th><th>发布日</th><th>证据等级</th><th>发文层级</th><th>现在标为</th><th>文件(点开看原文)</th></tr></thead><tbody>`;
    for (const ref of it.nodes){ const n = st.nodes[ref]; if (!n) continue;
      h += `<tr><td class="id">${esc(n.industry_name)} ${esc(n.id)}</td><td class="num">${esc(n.date)}</td><td>${esc(TIER_CN[n.tier]||n.tier)}</td><td>${esc(n.level||'')}</td><td>${pushChip(n.push)}</td>
        <td><a class="ext" href="${esc(n.url)}" target="_blank" rel="noopener">${esc(n.title)}</a><div class="use">${esc(n.source)}</div><details><summary>调研组说明(内部用语)</summary><div class="ctx">${esc(n.use)}</div></details></td></tr>`; }
    h += '</tbody></table>';
  }
  if (it.cards && it.cards.length){
    for (const ref of it.cards){ const c = st.cards[ref]; if (!c) continue;
      h += `<div class="card"><b>${esc(c.id)}</b> ${esc(c.title)} · 验证日 ${esc(c.verify_date)} · 档位 ${esc(c.level||'')}<ul>` +
        (c.hypotheses||[]).map(x => `<li><b>${esc({H1:'情形一',H2:'情形二',H0:'都没发生'}[x.key]||x.key)} ${Math.round(x.p*100)}%</b> ${esc(x.text)}</li>`).join('') + `</ul>` +
        (c.impact && c.impact.business ? `<div style="margin-top:6px"><b>对业务的影响(现文):</b> ${esc(c.impact.business)}</div>` : '') + `</div>`; }
  }
  if (it.why) h += `<div class="why"><b>我的建议是 ${esc(it.recommend)}:</b> ${esc(it.why)}</div>`;
  if (moot) h += `<div class="mootbar">你在算法规则第 1 条选了“促进类文件不计入”,这一项就自动按“不计入”处理,不用再选。</div>`;
  h += `<div class="opts">`;
  for (const o of it.options || []){
    const sel = ch === o.key;
    h += `<label class="opt ${sel ? 'sel' : ''}"><input type="radio" name="r-${it.id}" value="${esc(o.key)}" data-item="${esc(it.id)}" ${sel ? 'checked' : ''} ${moot ? 'disabled' : ''}>
      <div><span class="l">${esc(o.key)}. ${esc(o.label)}</span>${o.key === it.recommend ? '<span class="rec">建议</span>' : ''}` +
      (o.desc ? `<div class="d">${esc(o.desc)}</div>` : '') + `<div class="eff" data-eff="${esc(it.id)}:${esc(o.key)}"></div></div></label>`;
  }
  h += `</div><textarea class="note" data-item="${esc(it.id)}" placeholder="备注(可选;选了“有异议”或“不接受”时请写明)">${esc(S.notes[it.id]||'')}</textarea></article>`;
  return h;
}
function pushChip(p){ return `<span class="push ${p==='up'?'up':p==='dn'?'dn':'z'}">${PUSH_CN[p]||p}</span>`; }

function renderDir(it){
  const st = S.state;
  let h = `<article class="item" id="it-DIR"><div class="hd"><span class="chip id">DIR</span><span class="chip rule">${esc(it.rule)}</span></div><h3>${esc(it.title)}</h3><p class="q">${esc(it.question)}</p><div class="dirlist">`;
  for (const k of st.order){ const ind = st.industries[k], d = ind.direction;
    const cls = d.stance === '支持' ? 's' : d.stance === '限制' ? 'r' : 'n';
    h += `<div class="dir">` + (d.confirmed ? `<span class="fixed">✓</span>` : `<input type="checkbox" data-dir="${esc(k)}" ${S.dirs[k] ? 'checked' : ''}>`) +
      `<span><b>${esc(ind.name)}</b><br><span class="b">${d.confirmed ? '首轮已确认,这轮没动' : '请确认'}</span></span><span class="st ${cls}">${esc(d.stance)}</span>` +
      `<span><span class="b">依据文件编号 ${esc((d.basis||[]).join(', '))} · 判定者:${esc(d.judged_by||'')}</span><details><summary>依据文件的原话</summary><div class="ctx">${esc(d.note||'')}</div></details></span></div>`; }
  h += `</div></article>`;
  return h;
}

function renderNav(){
  const st = S.state; let h = '';
  for (const g of groups()){
    const items = st.items.filter(it => it.group === g && it.id !== 'DIR' && !isMoot(it));
    const done = items.filter(it => S.choices[it.id]).length, ind = st.industries[g];
    let t = '';
    if (ind){ const pv = S.preview && S.preview.temps[g]; const chg = pv && (pv.temp !== ind.temp);
      t = `<span class="t ${chg ? 'chg' : ''}">${ind.temp}${chg ? '→' + pv.temp : ''}</span>`; }
    const c = g === 'direction' ? `<span class="c">${st.order.filter(k => !st.industries[k].direction.confirmed && S.dirs[k]).length}/${st.order.filter(k => !st.industries[k].direction.confirmed).length}</span>`
      : `<span class="c ${done === items.length ? 'done' : 'todo'}">${done}/${items.length}</span>`;
    h += `<a href="#g-${g}"><span class="n">${esc(groupLabel(g))}</span>${t}${c}</a>`;
  }
  h += `<a href="#g-rules"><span class="n">不用你定的 / 已定规则</span></a>`;
  $('#nav').innerHTML = h;
}

function updateProgress(){
  const items = decidable(), done = items.filter(it => S.choices[it.id]).length;
  const dirsTodo = S.state.order.filter(k => !S.state.industries[k].direction.confirmed).length;
  const dirsOk = S.state.order.filter(k => !S.state.industries[k].direction.confirmed && S.dirs[k]).length;
  $('#prog').innerHTML = `已定 <b>${done}</b>/${items.length} 项 · 产业方向已确认 <b>${dirsOk}</b>/${dirsTodo}`;
  document.querySelectorAll('.item[id^=it-]').forEach(el => { const id = el.id.slice(3); if (id === 'DIR') return;
    const it = S.state.items.find(x => x.id === id); el.classList.toggle('done', !!S.choices[id] && !isMoot(it)); });
  document.querySelectorAll('textarea.note').forEach(t => { const it = S.state.items.find(x => x.id === t.dataset.item);
    const o = (it.options||[]).find(o => o.key === S.choices[it.id]); t.classList.toggle('req', !!(o && o.needs_note && !(S.notes[it.id]||'').trim())); });
  renderNav();
}

function onChange(){
  // moot 状态可能变化(G1),重渲染但保留滚动
  const y = window.scrollY; render(); window.scrollTo(0, y); schedulePreview();
}
function schedulePreview(){ clearTimeout(S.timer); S.timer = setTimeout(doPreview, 120); }
async function doPreview(){
  const r = await fetch('/api/preview', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({choices: S.choices})});
  S.preview = await r.json(); applyPreview(); renderNav();
}
function applyPreview(){
  if (!S.preview) return;
  const st = S.state;
  document.querySelectorAll('[data-eff]').forEach(el => {
    const [id, key] = el.dataset.eff.split(':'); const pi = S.preview.per_item[id];
    if (!pi){ el.textContent = '不影响温度'; return; }
    const res = pi[key]; if (!res) return;
    if (id === 'G2'){ const chg = Object.entries(res).filter(([k,v]) => v.temp !== st.industries[k].temp);
      el.innerHTML = chg.length ? '选它以后:' + chg.map(([k,v]) => `${esc(st.industries[k].name)} ${st.industries[k].temp}→<span class="chg">${v.temp}(${esc(v.stance_cn)})</span>`).join(' · ') : '选它以后:温度与现在一致'; return; }
    el.innerHTML = Object.entries(res).map(([k,v]) => { const cur = S.preview.temps[k];
      const same = cur && cur.temp === v.temp && cur.stance === v.stance;
      return `选它以后 ${esc(st.industries[k].name)}:${st.industries[k].temp}(${esc(st.industries[k].stance_cn)})→ ${same ? '' : '<span class="chg">'}${v.temp}(${esc(v.stance_cn)})${same ? '' : '</span>'}`; }).join(' · ');
  });
}

$('#btnRec').addEventListener('click', () => { for (const it of decidable()){ if (!S.choices[it.id] && it.recommend && it.recommend !== 'all') S.choices[it.id] = it.recommend; } onChange(); });
$('#btnSave').addEventListener('click', async () => {
  const t = $('#toast'); t.className = 'toast'; t.textContent = '保存中…';
  const moot = S.state.items.filter(isMoot).map(it => it.id);
  const r = await fetch('/api/save', {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({choices: S.choices, notes: S.notes, directions: S.dirs, moot})});
  const j = await r.json();
  if (j.ok){ t.textContent = `已保存 ${j.saved_at}` + (j.undecided.length ? ` · 还有 ${j.undecided.length} 项没选` : ' · 全部选完'); $('#round').textContent = S.state.round + ' · 上次保存 ' + j.saved_at; }
  else { t.className = 'toast err'; t.textContent = '保存失败'; }
});
load();
</script>
</body>
</html>
